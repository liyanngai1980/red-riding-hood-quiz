const COSTUMES = {
  red:      { name: '小紅帽',   emoji: '🧺', cost: 0,  desc: '經典紅斗篷',            cape: ['#c22727', '#7e1414', 'rgba(90,10,10,0.55)'] },
  tang:     { name: '唐裝',     emoji: '🏮', cost: 30, desc: '金黃唐裝＋瓜皮帽',      cape: ['#d4a017', '#8a5a10', 'rgba(120,70,10,0.55)'] },
  princess: { name: '公主裝',   emoji: '👑', cost: 50, desc: '粉紅公主裙＋金皇冠',    cape: ['#f7a8c8', '#d16a9a', 'rgba(150,60,100,0.55)'] },
  cowboy:   { name: '西部牛仔', emoji: '🤠', cost: 40, desc: '牛仔帽＋棕色流蘇斗篷',  cape: ['#a9713a', '#6e4518', 'rgba(90,55,20,0.55)'] }
};
let wardrobe = { owned: ['red'], eq: 'red' };
try {
  const w = JSON.parse(localStorage.getItem('lrrh_ward'));
  if (w && w.owned && w.owned.includes('red')) wardrobe = w;
} catch (e) {}
player.costume = wardrobe.eq;
function saveWard() { try { localStorage.setItem('lrrh_ward', JSON.stringify(wardrobe)); } catch (e) {} }

const wardOverlay = document.getElementById('wardOverlay');
const wardBtn = document.getElementById('wardBtn');
function renderWard() {
  document.getElementById('wardCoins').textContent = '🪙 金幣：' + coinCount;
  const list = document.getElementById('wardList');
  list.innerHTML = '';
  for (const id of Object.keys(COSTUMES)) {
    const c = COSTUMES[id];
    const owned = wardrobe.owned.includes(id);
    const eq = wardrobe.eq === id;
    const row = document.createElement('div');
    row.className = 'wardItem';
    row.innerHTML = `<img class="wi-img" src="assets/cost_${id}.png" alt="${c.name}">` +
      `<div class="wi-info"><div class="wi-name">${c.name}</div><div class="wi-desc">${c.desc}</div></div>`;
    const b = document.createElement('button');
    if (eq) {
      b.textContent = '✓ 穿著中'; b.className = 'eq'; b.disabled = true;
    } else if (owned) {
      b.textContent = '穿上';
      b.addEventListener('click', () => {
        wardrobe.eq = id; player.costume = id; saveWard(); BGM.sfx('correct'); renderWard();
      });
    } else {
      b.textContent = `🪙${c.cost} 購買`;
      b.disabled = coinCount < c.cost;
      b.addEventListener('click', () => {
        if (coinCount < c.cost) return;
        coinCount -= c.cost;
        wardrobe.owned.push(id);
        wardrobe.eq = id; player.costume = id;
        saveWard(); BGM.sfx('coin'); renderWard();
      });
    }
    row.appendChild(b);
    list.appendChild(row);
  }
  renderOwnRow();
}
function renderOwnRow() {
  const row = document.getElementById('ownRow');
  if (!row) return;
  row.innerHTML = '';
  for (const id of wardrobe.owned) {
    const c = COSTUMES[id];
    if (!c) continue;
    const d = document.createElement('div');
    d.className = 'ownItem' + (wardrobe.eq === id ? ' eq' : '');
    d.title = c.name;
    d.innerHTML = `<img src="assets/cost_${id}.png" alt="${c.name}">`;
    d.addEventListener('click', () => {
      wardrobe.eq = id; player.costume = id; saveWard();
      BGM.sfx('click');
      renderOwnRow();
    });
    row.appendChild(d);
  }
}
wardBtn.addEventListener('click', () => { BGM.sfx('click'); renderWard(); wardOverlay.classList.add('show'); });
document.getElementById('ownLabel').addEventListener('click', () => { BGM.sfx('click'); renderWard(); wardOverlay.classList.add('show'); });
document.getElementById('wardClose').addEventListener('click', () => { BGM.sfx('click'); wardOverlay.classList.remove('show'); });
renderOwnRow();               // 首頁初次載入即顯示已獲得套裝

/* ====================== 開始 / 重生 ====================== */
function startGame() {
  score = 0;
  lives = 3;
  coinCount = 0;
  keyCount = 0;
  stage = startStage;
  failReason = '';
  stageStats = { asked:0, correct:0, wrong:0 };
  allStats = [];
  buildLevel();
  respawn();
  state = 'playing';
  BGM.play(stage);
}

function respawn() {
  let cx = checkpoints[0];
  for (const c of checkpoints) if (player.x >= c) cx = c;

  buildLevel();   // 重生後魔物重置，但已收集的鑰匙保留（不重置 keyCount）

  player.x = cx;
  player.y = GROUND_Y - player.h - 2;
  player.vx = 0;
  player.vy = 0;
  player.facing = 1;
  player.onGround = false;
  player.hurtTimer = 1.6;
  player.jumpLock = false;
  player.jumpsLeft = player.maxJumps;   // ⭐ 重生回滿
  player.spinT = 0;
  player.mount = null;
  player.ridingOn = null;

  cam.x = Math.max(0, player.x - 200);
  cam.y = 0;
}

/* ====================== 輸入 ====================== */
const keys = {};
const joy = { active:false, id:null, baseX:0, baseY:0, dx:0, dy:0 };
const jmp = { active:false, id:null };
const atk = { active:false, id:null };      // 🥅 攻擊按鈕

canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  const x = e.clientX, y = e.clientY;

  if (state === 'quiz' || state === 'ready' || state === 'jerusalem' || state === 'defeat') return;
  if (state === 'stageclear') { nextStage(); return; }
  if (state !== 'playing') { showStartMenu(); return; }

  const jbx = W - 88, jby = H - 96;
  if (Math.hypot(x - jbx, y - jby) < 85) {
    jmp.active = true; jmp.id = e.pointerId;
    return;
  }
  const abx = W - 196, aby = H - 96;         // 🥅 攻擊鍵（跳躍鍵左邊）
  if (Math.hypot(x - abx, y - aby) < 58) {
    atk.active = true; atk.id = e.pointerId;
    return;
  }
  if (x < W * 0.5 && !joy.active) {
    joy.active = true;
    joy.id = e.pointerId;
    joy.baseX = x; joy.baseY = y;
    joy.dx = 0; joy.dy = 0;
    return;
  }
  if (x >= W * 0.5 && !jmp.active) {
    jmp.active = true; jmp.id = e.pointerId;
  }
}, { passive:false });

canvas.addEventListener('pointermove', e => {
  if (joy.active && e.pointerId === joy.id) {
    let dx = e.clientX - joy.baseX;
    let dy = e.clientY - joy.baseY;
    const len = Math.hypot(dx, dy);
    if (len > JOY_R) { dx = dx / len * JOY_R; dy = dy / len * JOY_R; }
    joy.dx = dx; joy.dy = dy;
  }
}, { passive:false });

function endPointer(e) {
  if (joy.active && e.pointerId === joy.id) {
    joy.active = false; joy.id = null; joy.dx = 0; joy.dy = 0;
  }
  if (jmp.active && e.pointerId === jmp.id) {
    jmp.active = false; jmp.id = null;
  }
  if (atk.active && e.pointerId === atk.id) {
    atk.active = false; atk.id = null;
  }
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);

window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code)) e.preventDefault();
  if (state === 'stageclear' && (e.code === 'Space' || e.code === 'Enter')) { nextStage(); return; }
  if ((state === 'gameover' || state === 'win') && (e.code === 'Space' || e.code === 'Enter')) showStartMenu();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

/* ====================== 物理 ====================== */
function moveX(ent, dt) {
  ent.x += ent.vx * dt;
  for (const p of platforms) {
    if (overlap(ent, p)) {
      if (ent.vx > 0)      ent.x = p.x - ent.w;
      else if (ent.vx < 0) ent.x = p.x + p.w;
      ent.vx = 0;
    }
  }
  if (ent.x < 0) { ent.x = 0; ent.vx = 0; }
}

function moveY(ent, dt) {
  ent.y += ent.vy * dt;
  const wasAir = !ent.onGround;
  ent.onGround = false;
  for (const p of platforms) {
    if (overlap(ent, p)) {
      if (ent.vy > 0) {
        ent.y = p.y - ent.h;
        ent.vy = 0;
        ent.onGround = true;
        if (wasAir && ent === player) ent.landT = 0.16;   // 落地壓縮
      } else if (ent.vy < 0) {
        ent.y = p.y + p.h;
        ent.vy = 0;
      }
    }
  }
}

/* ====================== 更新 ====================== */
function readInput() {
  let x = 0;
  if (joy.active) x += clamp(joy.dx / JOY_R, -1, 1);
  if (keys['ArrowLeft'] || keys['KeyA'])  x -= 1;
  if (keys['ArrowRight'] || keys['KeyD']) x += 1;
  inputX = clamp(x, -1, 1);
  if (Math.abs(inputX) < 0.2) inputX = 0;

  wantJump = jmp.active || !!keys['Space'] || !!keys['ArrowUp'] || !!keys['KeyW'];
  wantAtk  = atk.active || !!keys['KeyJ'] || !!keys['KeyF'] || !!keys['KeyX'];   // 🥅 攻擊
}

function updatePlayer(dt) {
  if (player.noMountT > 0) player.noMountT -= dt;
  if (player.hurtTimer > 0) player.hurtTimer -= dt;
  if (player.spinT > 0) player.spinT -= dt;
  if (player.landT > 0) player.landT -= dt;

  /* --- 水平移動 --- */
  const accel = 2600, fric = 2400;
  if (inputX !== 0) {
    player.vx += inputX * accel * dt;
    player.vx = clamp(player.vx, -MOVE_SPEED, MOVE_SPEED);
    player.facing = inputX > 0 ? 1 : -1;
  } else {
    if (player.vx > 0)      player.vx = Math.max(0, player.vx - fric * dt);
    else if (player.vx < 0) player.vx = Math.min(0, player.vx + fric * dt);
  }

  /* --- ⭐ 跳躍 / 二段跳 --- */
  if (wantJump && !player.jumpLock && player.jumpsLeft > 0) {
    const isDouble = !player.onGround;     // 空中按鍵 = 二段跳
    player.vy = isDouble ? -JUMP_V * 0.92 : -JUMP_V;
    player.onGround = false;
    player.jumpLock = true;
    player.jumpsLeft--;

    BGM.sfx(isDouble ? 'jump2' : 'jump');
    if (isDouble) {
      // 二段跳：翻滾 + 衝擊環 + 藍色粒子
      player.spinT = 0.42;
      spawnRing(player.x + player.w/2, player.y + player.h/2, '#7df9ff');
      spawnDust(player.x + player.w/2, player.y + player.h, 10, '#7df9ff');
    } else {
      spawnDust(player.x + player.w/2, player.y + player.h, 6, '#ffffff');
    }
  }
  if (!wantJump) player.jumpLock = false;

  /* --- 🥅 捕捉網攻擊 / 丟出網中小妖 --- */
  if (player.atkCD > 0) player.atkCD -= dt;
  if (player.atkT > 0) player.atkT -= dt;
  // 空手站在大怪背上時不出網（避免誤觸答題/擋退），改為蓄力馴服
  const taming = player.ridingOn && !player.mount && !player.holding.length && !player.holdingHydra;
  if (wantAtk && player.atkCD <= 0 && !taming && player.mount) {   // 按住可連發（受 atkCD 限制）
    // 🏇 座駕攻擊：以魔物原本的攻擊方式出招（🐺衝前／🐻揮掌／🦁吼波／🦅俯衝／🐉火球）
    const m = player.mount, bk = m.cfg.beast, mcx = m.x + m.w/2;
    player.atkLock = wantAtk;
    if (bk === 'dragon') {
      // 🔥 龍：噴出火球（長射程）
      player.atkCD = 0.5;
      const fy = m.y + 6;
      shots.push({ x: mcx + m.dir * 46, y: fy, vx: m.dir * 560, r: 10, life: 2.4 });
      m.animT += 0.5;
      BGM.sfx('throw');
      spawnDust(mcx + m.dir * 46, fy, 6, '#ff9a3d');
    } else if (bk === 'bear') {
      // 🐻 熊：站起來揮掌（身前大範圍橫掃）
      player.atkCD = 0.6;
      m.mode = 'atk'; m.modeT = 0.34; m.atkDir = m.dir;
      const box = { x: m.dir > 0 ? m.x + m.w - 6 : m.x - 150, y: m.y - 26, w: 156, h: m.h + 30 };
      mountStrike(m, box);
      BGM.sfx('swing');
      spawnRing(m.dir > 0 ? m.x + m.w + 60 : m.x - 60, m.y + m.h/2, '#ffd54a');
    } else if (bk === 'lion') {
      // 🦁 獅：吼出衝擊波（遠距離音波）
      player.atkCD = 0.65;
      m.mode = 'atk'; m.modeT = 0.5; m.atkDir = m.dir;
      shots.push({ x: mcx + m.dir * 50, y: m.y + m.h * 0.4, vx: m.dir * 520, r: 14, life: 1.4, wave: true });
      BGM.sfx('throw');
      spawnRing(mcx + m.dir * 50, m.y + m.h * 0.4, '#ffb347');
    } else {
      // 🐺🦅 狼／鷹：向前猛衝撲擊（衝撞路徑上的小妖）
      player.atkCD = 0.55;
      m.dashT = 0.28; m.dashDir = m.dir;
      BGM.sfx('swing');
      spawnDust(mcx, m.y + m.h, 8, '#ffffff');
    }
  } else if (wantAtk && !player.atkLock && player.atkCD <= 0 && !taming) {
    player.atkT = 0.26;                     // 點按 → 揮網捕捉
    player.atkCD = 0.45;
    player.atkHitDone = false;
    BGM.sfx('swing');
    // 💨 揮網風效：向前噴出風之流線
    for (let i = 0; i < 9; i++) {
      particles.push({
        x: player.x + player.w / 2 + player.facing * (8 + Math.random() * 44),
        y: player.y + 4 + Math.random() * player.h * 0.75,
        vx: player.facing * (280 + Math.random() * 260),
        vy: (Math.random() - 0.5) * 130,
        life: 0.26 + Math.random() * 0.14, maxLife: 0.4,
        r: 1.4 + Math.random() * 2.4, color: 'rgba(225,242,255,0.9)'
      });
    }
  }
  player.atkLock = wantAtk;

  /* --- ⚡ 按住蓄力 1 秒 → 放出一隻小妖（或扔出巨龍） --- */
  if (wantAtk && (player.holding.length || player.holdingHydra)) {
    player.chargeT += dt;
    if (player.chargeT >= 1) {
      player.chargeT = 0;
      throwHeld();
      player.atkCD = 0.4;
    }
  } else if (wantAtk && player.ridingOn && !player.mount) {
    // ⚡ 空手站在大怪背上蓄力 1 秒 → 馴服成為座駕！
    player.chargeT += dt;
    if (player.chargeT >= 1) {
      player.chargeT = 0;
      player.atkCD = 0.4;
      if ((player.mounts || []).length >= 2) {
        // 最多馴服兩隻座駕
        spawnRing(player.x + player.w/2, player.y - 10, '#ffb3b3');
        spawnDust(player.x + player.w/2, player.y - 10, 8, '#ffb3b3');
        BGM.sfx('wrong');
      } else {
        openQuiz(player.ridingOn, { tame: true });   // 📖 答對才能馴服為座駕
      }
    }
  } else if (wantAtk && player.mount) {
    // ⚡ 騎乘中長按捕網鍵 1 秒：附近有野生大怪 → 答題馴服多一隻；附近無敵人 → 跳出大怪外
    const m = player.mount, mcx = m.x + m.w/2;
    let target = null;
    for (const b of beasts) {
      if (b.defeated || b.tamed || b === m) continue;
      const near = { x: m.x - 34, y: m.y - 34, w: m.w + 68, h: m.h + 68 };
      if (overlap(near, b)) { target = b; break; }
    }
    // ⚔️ 附近有可攻擊的敵人時，按住＝連續攻擊，不蓄力下騎
    let combat = false;
    for (const e of enemies) { if (!e.dead && Math.abs(e.x + e.w/2 - mcx) < 480) { combat = true; break; } }
    if (!combat) for (const b of beasts) { if (!b.defeated && b !== m && Math.abs(b.x + b.w/2 - mcx) < 480) { combat = true; break; } }
    if (target) {
      player.chargeT += dt;   // 有可馴服的大怪：蓄力答題優先
      if (player.chargeT >= 1) {
        player.chargeT = 0;
        player.atkCD = 0.4;
        if ((player.mounts || []).length < 2) openQuiz(target, { tame: true });   // 📖 答對 → 馴服並換騎新一隻
      }
    } else if (combat) {
      player.chargeT = 0;     // 戰鬥中：長按不會下騎，只靠 atkCD 連續出招
    } else {
      player.chargeT += dt;
      if (player.chargeT >= 1) {
        // 🦘 跳出大怪外（下騎）
        player.chargeT = 0;
        player.atkCD = 0.4;
        player.mount = null;
        player.noMountT = 0.9;
        player.vy = -520;
        player.onGround = false;
        BGM.sfx('jump2');
        spawnRing(player.x + player.w/2, player.y + player.h, '#7df9ff');
      }
    }
  } else {
    player.chargeT = 0;
  }

  /* --- 🏇 座駕模式：由座駕帶動，跳過自身重力物理 --- */
  if (player.mount) { updateMountRide(dt); return; }

  /* --- 重力 --- */
  player.vy += GRAVITY * dt;
  if (player.vy > MAX_FALL) player.vy = MAX_FALL;

  /* --- 碰撞 --- */
  moveX(player, dt);
  moveY(player, dt);

  /* --- ⭐ 落地時補滿跳躍次數 --- */
  if (player.onGround) {
    player.jumpsLeft = player.maxJumps;
    player.spinT = 0;
  }

  /* --- 走路動畫 --- */
  if (player.onGround && Math.abs(player.vx) > 20) {
    player.animT += dt * Math.abs(player.vx) * 0.06;
  } else {
    player.animT *= 0.9;
  }

  /* --- 掉進坑洞 --- */
  if (player.y > GROUND_Y + 260) hurtPlayer(true);
}

/* 🏇 答對馴服考驗：掉出鑰匙＋成為座駕 */
function grantTame(b) {
  if (!b.keyDropped) {
    b.keyDropped = true;
    keyItems.push({ x: b.x + b.w/2, y: b.y + b.h/2 - 10, vy: -320, bounces: 0, state: 'bounce', t: 0, spin: 0, beast: b });
    spawnRing(b.x + b.w/2, b.y + b.h/2, '#ffe27a');
  }
  score += 150;
  tameBeast(b);
}

/* 🏇 馴服大怪成為座駕（九頭龍除外——牠不在 beasts 之列） */
function tameBeast(b) {
  if (!player.mounts) player.mounts = [];
  if (!player.mounts.includes(b)) player.mounts.push(b);
  if (!b.tamed) {
    b.tamed = true;
    b.freezeT = 0;
    b.mode = 'pace';
    spawnRing(b.x + b.w / 2, b.y + b.h / 2, '#ffe9a8');
    spawnDust(b.x + b.w / 2, b.y + b.h / 2, 14, '#ffd54a');
    BGM.sfx('capture');
  }
  player.mount = b;
}

/* 🏇 座駕騎乘：地面座駕高速奔馳；飛鷹座駕自由飛行（按住跳躍鍵上升，↓ 鍵下坐騎） */
/* 🧱 座駕腳下支撐面：地面或石塊平台頂（與小紅帽佔的空間一致） */
function mountSupport(b) {
  const gy = groundYAt(b.x + b.w / 2);
  let best = (gy !== null) ? gy : null;
  for (const p of platforms) {
    if (b.x + b.w <= p.x + 4 || b.x >= p.x + p.w - 4) continue;   // 水平無重疊
    if (b.y + b.h > p.y + 34) continue;                            // 腳已低於平台太多（從下方穿過）
    if (best === null || p.y < best) best = p.y;
  }
  return best;
}

function updateMountRide(dt) {
  const b = player.mount;
  if (!b || b.defeated) { player.mount = null; return; }
  const down = keys['ArrowDown'] || keys['KeyS'] || (joy.active && joy.dy > 45);
  if (down) {                       // 跳下坐騎（坐騎留在原地等你）
    player.mount = null;
    player.noMountT = 0.9;          // 短暫不自動再上騎
    player.vy = -260;
    player.onGround = false;
    BGM.sfx('jump');
    return;
  }
  if (inputX !== 0) b.dir = inputX > 0 ? 1 : -1;
  player.facing = b.dir;
  // 💨 衝刺撲擊（🐺🦅 座駕攻擊）：短時間向前猛衝，撞死路徑小妖
  let dashBoost = 0;
  if (b.dashT > 0) {
    b.dashT -= dt;
    dashBoost = b.dashDir * 640;
    mountStrike(b, { x: b.x - 16, y: b.y - 30, w: b.w + 32, h: b.h + 50 });
    if (Math.random() < 0.6) spawnDust(b.x + b.w/2, b.y + b.h, 2, '#ffffff');
  }
  if (b.flying || b.cfg.beast === 'dragon') {
    // 🦅🐉 飛鷹／龍：任意飛行——左右自由，按住跳躍鍵攀升，放開緩降
    b.x += (inputX * 330 + dashBoost) * dt;
    b.y += (wantJump ? -300 : 90) * dt;
    b.y = clamp(b.y, GROUND_Y - 560, GROUND_Y - 40);
    // 🧱 飛行座駕下降時也能停在石塊上
    if (!wantJump) {
      const sup = mountSupport(b);
      if (sup !== null && b.y + b.h > sup && (b.py ?? b.y) + b.h <= sup + 6) b.y = sup - b.h;
    }
    b.animT += dt * 9;
    b.moveSp = 120;
  } else {
    // 🐺🐻🦁 地面座駕：高速奔馳＋可以跳躍（取金幣、越過障礙）
    b.x += (inputX * 410 + dashBoost) * dt;
    if (wantJump && b.onGround) { b.vy = -780; b.onGround = false; BGM.sfx('jump2'); }
    const sup = mountSupport(b);
    if (b.onGround && sup !== null && b.y + b.h <= sup + 34) {
      b.y = sup - b.h; b.vy = 0;             // 貼地行走（含小坡與石塊）
    } else {
      b.vy = Math.min((b.vy || 0) + GRAVITY * dt, MAX_FALL);
      b.y += b.vy * dt;
      if (sup !== null && b.vy >= 0 && b.y + b.h >= sup && (b.py ?? b.y) + b.h <= sup + 6) {
        b.y = sup - b.h; b.vy = 0; b.onGround = true;   // 落地／落在石塊上
      } else {
        b.onGround = false;
      }
    }
    if (b.y > GROUND_Y + 160) {
      // 🕳️ 座駕跌入深谷消失，小紅帽留在坑邊（回到普通操作）
      b.defeated = true;
      player.mounts = (player.mounts || []).filter(x => x !== b);
      player.mount = null;
      player.noMountT = 0.9;
      BGM.sfx('hurt');
      return;
    }
    b.moveSp = Math.abs(inputX) * 410;
    b.animT += dt * (2.2 + Math.abs(inputX) * 9);
  }
  b.x = clamp(b.x, 20, WORLD_W - b.w - 20);
  player.x = b.x + b.w / 2 - player.w / 2;
  player.y = b.y - player.h;
  player.vx = 0;
  player.vy = 0;
  player.onGround = true;
  player.jumpsLeft = player.maxJumps;
  player.animT += dt * (1.5 + Math.abs(inputX) * 3);
}

function updateEnemies(dt) {
  for (const e of enemies) {
    if (e.dead) { e.deadT += dt; continue; }

    e.anim += dt;

    /* --- 各小怪的移動方式 --- */
    let spd = ENEMY_SPEED;
    if (e.kind === 'piranha') spd *= 0.55;                                   // 🌺 慢慢滑步
    if (e.kind === 'bee')     spd *= 1.3;                                    // 🐝 嗡嗡飛行
    if (e.kind === 'frog')    spd  = 0;                                      // 🐸 只用跳的
    if (e.kind === 'snake')   spd *= 0.4 + 0.6 * Math.abs(Math.sin(e.anim * 2.4));  // 🐍 蠕動伸縮
    e.x += e.dir * spd * dt;
    if (e.x < e.minX)            { e.x = e.minX; e.dir = 1; }
    if (e.x + e.w > e.maxX)      { e.x = e.maxX - e.w; e.dir = -1; }

    if (e.kind === 'piranha') {
      // 🌺 行走時定期伸出舌頭
      e.tongueT -= dt;
      if (e.tongueT <= 0) e.tongueT = 2.5 + Math.random() * 2;
      e.tongue = e.tongueT < 0.7 ? Math.sin((0.7 - e.tongueT) / 0.7 * Math.PI) : 0;
    } else if (e.kind === 'bat') {
      // 🦇 蝙蝠：貼地低飛盤旋，捕網容易捕捉
      const alt = GROUND_Y - 46 + Math.sin(e.anim * 3.2) * 14;
      e.y += (alt - e.y) * Math.min(1, dt * 4);
    } else if (e.kind === 'bee') {
      // 🐝 蜜蜂：空中盤旋巡邏，偶爾低飛俯衝
      e.lowT -= dt;
      if (e.lowT <= 0) { e.lowT = 2.5 + Math.random() * 3; e.low = 0.9; }
      if (e.low > 0) e.low -= dt;
      const alt = (e.low > 0 ? GROUND_Y - 30 : GROUND_Y - 90) + Math.sin(e.anim * 4.5) * 12;
      e.y += (alt - e.y) * Math.min(1, dt * 5);
    } else if (e.kind === 'frog') {
      // 🐸 坐著為主，偶爾向前低跳
      e.hopT -= dt;
      if (e.hopT <= 0 && e.hy <= 0) { e.hopT = 2.2 + Math.random() * 2; e.vy = 240; }
      if (e.vy > 0 || e.hy > 0) {
        e.hy += e.vy * dt;
        e.vy -= 1400 * dt;
        e.x += e.dir * 70 * dt;
        if (e.hy <= 0) { e.hy = 0; e.vy = 0; }
        if (e.x < e.minX)       { e.x = e.minX; e.dir = 1; }
        if (e.x + e.w > e.maxX) { e.x = e.maxX - e.w; e.dir = -1; }
      }
      e.y = GROUND_Y - e.h - e.hy;
    }

    const hitBox = player.mount || player;
    if (overlap(hitBox, e)) {
      if (player.mount) {
        // 🏇 座駕護主：小怪只被彈開，不會死——要主動攻擊才能消滅
        const d2 = pushApart(e, 0.4);
        if (d2) e.dir = -d2;
        continue;
      }
      const stomping = player.vy > 60 && (player.y + player.h) - e.y < 26 && e.kind !== 'bat' && e.kind !== 'bee';
      if (stomping) {
        e.dead = true;
        e.deadT = 0;
        player.vy = -540;
        BGM.sfx('stomp');
        // 踩敵人後補一次跳躍（獎勵）
        player.jumpsLeft = Math.max(player.jumpsLeft, 1);
        score += 100;
        spawnDust(e.x + e.w/2, e.y + e.h/2, 8);
      } else {
        const d = pushApart(e, 0.4);            // 小怪也被彈開
        if (d) e.dir = -d;                      // 小怪往反方向退走
        if (player.hurtTimer <= 0) hurtPlayer(false, e.x + e.w / 2);
      }
    }
  }
}

function updateCoins(dt) {
  for (const c of coins) {
    if (c.got) continue;
    if (c.cool > 0) { c.cool -= dt; continue; }
    const dx = (player.x + player.w/2) - c.x;
    const dy = (player.y + player.h/2) - c.y;
    if (Math.abs(dx) < 26 && Math.abs(dy) < 30) {
      collectCoin(c);           // 金幣直接收集
      continue;
    }
    if (player.mount) {         // 🏇 座駕身體也能碰到金幣
      const m = player.mount;
      const mdx = (m.x + m.w/2) - c.x, mdy = (m.y + m.h/2) - c.y;
      if (Math.abs(mdx) < m.w/2 + 14 && Math.abs(mdy) < m.h/2 + 14) collectCoin(c);
    }
  }
}

/* ====================== 科目魔物（答題擊敗） ====================== */
function groundYAt(x) {
  let best = null;
  for (const p of platforms) {
    if (p.kind !== 'ground') continue;
    if (x >= p.x && x <= p.x + p.w) {
      if (best === null || p.y < best) best = p.y;
    }
  }
  return best;
}

function updateBeasts(dt) {
  player.ridingOn = null;             // 每幀重新偵測站在大怪背上
  for (const b of beasts) {
    if (b.defeated) continue;
    if (b.cool > 0) b.cool -= dt;
    b.px = b.x; b.py = b.y;           // 記住移動前位置（用來載著站在背上的小紅帽）
    // 🧍 站上大怪背：不會受傷、不會觸發答題；空手蓄力 1 秒可馴服為座駕
    if (!player.mount && player.vy >= -20) {
      const pBot = player.y + player.h;
      if (pBot > b.y - 8 && pBot < b.y + 34 && player.x + player.w > b.x + 6 && player.x < b.x + b.w - 6) {
        player.y = b.y - player.h;
        player.vy = 0;
        player.onGround = true;
        player.ridingOn = b;
        // 🏇 跳上已馴服的座駕 → 自動上騎
        if (b.tamed && !player.mount && player.noMountT <= 0 && (player.mounts || []).includes(b)) {
          player.mount = b;
        }
      }
    }
    if (b.tamed) continue;            // 🏇 已馴服的座駕不再自主攻擊
    // ❄️ 被伙伴撞中 → 凍結：不能移動不能攻擊，但碰到仍可安全答題
    if (b.freezeT > 0) {
      b.freezeT -= dt;
      if (b.flying) {          // 飛行魔物被凍結會降落到地面，方便小紅帽靠近
        const gy = groundYAt(b.x + b.w/2);
        const ty = (gy !== null ? gy : GROUND_Y) - b.h;
        b.y += Math.min(Math.max(ty - b.y, -400 * dt), 400 * dt);
      }
      if (b.cool <= 0 && overlap(player, b)) { openQuiz(b); break; }
      continue;
    }
    b.modeT -= dt;
    b.roarCD -= dt;
    b.diveCD -= dt;

    const dx = (player.x + player.w/2) - (b.x + b.w/2);
    const dist = Math.abs(dx);
    const aggro = b.flying ? 560 : 460;
    const kind = b.cfg.beast;

    if (dist < aggro) {
      if (b.mode === 'pace') {
        /* --- 逼近階段：各魔物醞釀攻擊 --- */
        if (kind === 'wolf') {
          // 🐺 狼：伏低慢爬幾步 → 突然衝出
          b.stepT += dt;
          b.x += Math.sign(dx) * 34 * dt; b.dir = Math.sign(dx) || b.dir; b.moveSp = 34;
          if (b.stepT > 1.9 && dist < 380) { b.mode = 'wind'; b.modeT = 0.42; b.stepT = 0; b.dashDir = Math.sign(dx) || 1; }
        } else if (kind === 'bear') {
          // 🐻 熊：爬行靠近 → 站起來揮熊掌
          b.x += Math.sign(dx) * 42 * dt; b.dir = Math.sign(dx) || b.dir; b.moveSp = 42;
          if (dist < 190) { b.mode = 'wind'; b.modeT = 0.5; b.atkDir = Math.sign(dx) || 1; }   // 💪 熊掌距離加倍
        } else if (kind === 'lion') {
          // 🦁 獅：慢行 → 鬃毛張開吼出衝擊波
          b.x += Math.sign(dx) * 30 * dt; b.dir = Math.sign(dx) || b.dir; b.moveSp = 30;
          if (b.roarCD <= 0 && dist < 540 && dist > 90) { b.mode = 'wind'; b.modeT = 0.75; b.atkDir = Math.sign(dx) || 1; }
        } else if (kind === 'dragon') {
          // 🐉 龍：爬行三四步 → 站起來噴火
          b.stepT += dt;
          b.x += Math.sign(dx) * 46 * dt; b.dir = Math.sign(dx) || b.dir; b.moveSp = 46;
          if (b.stepT > 1.7 && dist < 430) { b.mode = 'wind'; b.modeT = 0.6; b.stepT = 0; b.atkDir = Math.sign(dx) || 1; }
        } else if (kind === 'eagle') {
          // 🦅 鷹：高高低低盤旋（爬升時用力拍翼）
          b.x += Math.sign(dx) * 120 * dt; b.dir = Math.sign(dx) || b.dir; b.moveSp = 120;
          b.altT = (b.altT || 0) + dt;
          const alt = GROUND_Y - 230 + Math.sin(b.altT * 0.9 + b.phase) * 55;
          b.climb = alt - b.y;
          b.y += clamp(b.climb, -1, 1) * 70 * dt;
          if (b.diveCD <= 0 && dist < 460) { b.mode = 'wind'; b.modeT = 0.38; b.atkDir = Math.sign(dx) || 1; }
        }
      } else if (b.mode === 'wind') {
        /* --- 蓄勢階段（攻擊前搖，玩家可乘機捕捉或閃避） --- */
        b.moveSp = 0;
        if (kind === 'eagle') b.y -= 60 * dt;      // 先拉升再俯衝
        if (b.modeT <= 0) {
          b.mode = 'atk';
          if (kind === 'wolf')   b.modeT = 0.5;
          if (kind === 'bear')   b.modeT = 0.34;
          if (kind === 'lion') { b.modeT = 0.5; b.roarCD = 4.2;
            // 🦁 吼出衝擊波（可跳過或用捕捉網打掉）
            projs.push({ kind:'wave', x: b.x + b.w/2 + b.atkDir * 46, y: GROUND_Y - 26, vx: b.atkDir * 350, r: 12, life: 2.4, owner: b });
            spawnRing(b.x + b.w/2 + b.atkDir * 46, GROUND_Y - 44, '#ffb347');
          }
          if (kind === 'dragon') { b.modeT = 0.8; b.fireT = 0; }
          if (kind === 'eagle') { b.modeT = 1.0;
            // 🦅 俯衝：鎖定玩家當下位置衝下去
            const tx = player.x + player.w/2, ty = player.y + player.h/2;
            const ddx = tx - (b.x + b.w/2), ddy = ty - b.y, L = Math.hypot(ddx, ddy) || 1;
            b.dvx = ddx / L * 470; b.dvy = ddy / L * 470;
          }
        }
      } else if (b.mode === 'atk') {
        /* --- 攻擊階段：被碰到會受傷，必須閃避！ --- */
        if (kind === 'wolf') {
          b.x += b.dashDir * 430 * dt; b.dir = b.dashDir; b.moveSp = 430;
          if (overlap(player, b) && player.hurtTimer <= 0 && player.ridingOn !== b) { if (blockAttack(b)) return; hurtPlayer(false, b.x + b.w / 2); return; }
        } else if (kind === 'bear') {
          // 熊掌攻擊範圍（身前）
          const box = { x: b.atkDir > 0 ? b.x + b.w - 6 : b.x - 150, y: b.y - 26, w: 156, h: b.h + 30 };   // 💪 揮掌距加長兩倍
          if (overlap(player, box) && player.hurtTimer <= 0 && player.ridingOn !== b) { if (blockAttack(b)) return; hurtPlayer(false, b.x + b.w / 2); return; }
        } else if (kind === 'dragon') {
          b.fireT -= dt;
          if (b.fireT <= 0) { b.fireT = 0.13;
            projs.push({ kind:'flame', x: b.x + b.w/2 + b.atkDir * 46, y: b.y + 6,
              vx: b.atkDir * (250 + Math.random() * 70), vy: -60 + Math.random() * 90, r: 9, life: 1.7, owner: b });
          }
        } else if (kind === 'eagle') {
          b.x += b.dvx * dt; b.y += b.dvy * dt; b.dir = b.dvx > 0 ? 1 : -1; b.moveSp = 470;
          if (overlap(player, b) && player.hurtTimer <= 0 && player.ridingOn !== b) { if (blockAttack(b)) return; hurtPlayer(false, b.x + b.w / 2); return; }
        }
        if (b.modeT <= 0) { b.mode = 'rec'; b.modeT = kind === 'eagle' ? 1.1 : 0.8; }
      } else if (b.mode === 'rec') {
        /* --- 收招硬直：捕捉的好時機！ --- */
        b.moveSp = 20;
        if (kind === 'eagle') {          // 重新爬升回高空
          b.y += clamp((GROUND_Y - 250) - b.y, -1, 1) * 120 * dt;
          b.diveCD = 2.6 + Math.random() * 1.4;
        }
        if (b.modeT <= 0) b.mode = 'pace';
      }
    } else {
      // 原地徘徊
      b.mode = 'pace';
      b.x += Math.sin(time * 1.4 + b.phase) * 14 * dt;
      if (b.flying) b.y += Math.sin(time * 2.2 + b.phase) * 24 * dt;
      b.moveSp = 14;
    }
    // 步行/拍翼相位累積（速度越快步頻越快）
    b.animT = (b.animT || 0) + dt * (2.2 + b.moveSp * 0.045);

    if (!b.flying) {
      const gy = groundYAt(b.x + b.w/2);
      if (gy !== null) b.y = gy - b.h;
    } else {
      b.y = clamp(b.y, GROUND_Y - 300, GROUND_Y - 26);
    }

    // 🏇 大怪移動時載著站在背上的小紅帽
    if (player.ridingOn === b && !player.mount) { player.x += b.x - b.px; player.y = b.y - player.h; }

    // ❄️ 凍結狀態下碰到才會出題；平時碰到魔物會受傷（先甩伙伴凍結牠！）
    if (overlap(player, b) && b.cool <= 0) {
      const d = pushApart(b, 0.22);             // 身體互撞：雙方彈開，不再穿透
      if (player.hurtTimer <= 0) {
        hurtPlayer(false, b.x + b.w / 2);
        if (d) { b.x -= d * 34; b.modeT = Math.max(b.modeT, 0.5); }  // 魔物也往後彈開
      }
      break;
    }
  }
}

/* ---------- 🦁🐉 魔物投射物：衝擊波 / 火焰（可跳避、可用捕捉網打掉） ---------- */
function updateProjs(dt) {
  for (let i = projs.length - 1; i >= 0; i--) {
    const p = projs[i];
    p.x += p.vx * dt;
    p.life -= dt;
    if (p.kind === 'flame') {
      p.vy += 520 * dt;
      p.y += p.vy * dt;
      if (p.boss && Math.random() < 0.6) {   // 九頭龍火球帶火星尾跡
        particles.push({ x: p.x, y: p.y, vx: (Math.random()-0.5)*40, vy: -30 - Math.random()*40, life: 0.35, maxLife: 0.35, r: 2.5 + Math.random()*3, color: Math.random()<0.5?'#ff9a3d':'#ffd54a' });
      }
      if (p.y > GROUND_Y - 4) { spawnDust(p.x, GROUND_Y - 4, 5, '#ff9a3d'); projs.splice(i, 1); continue; }
    } else {
      p.r = Math.min(p.r + 40 * dt, 30);
      p.y = GROUND_Y - 24 + Math.sin(time * 10) * 2;
    }
    if (p.life <= 0 || p.x < cam.x - 300 || p.x > cam.x + W / scale + 300) { projs.splice(i, 1); continue; }
    const box = { x: p.x - p.r, y: p.y - p.r, w: p.r * 2, h: p.r * 2 };
    if (overlap(player, box) && player.hurtTimer <= 0) {
      // 🥅 揮網防守：抵消獅吼衝擊波 / 龍火球（九頭龍火球除外），雙方彈開
      if (!p.boss && player.atkT > 0) {
        spawnRing(p.x, p.y, '#aef1ff');
        spawnDust(p.x, p.y, 8, '#cfe8ff');
        const dir = -Math.sign(p.vx) || -player.facing;
        player.vx = dir * 300;             // 小紅帽向後彈開
        player.vy = -160;
        player.onGround = false;
        player.hurtTimer = 0.4;
        if (p.owner && !p.owner.defeated) {   // 發射的魔物也被震退
          p.owner.x += Math.sign(p.vx) * -48;
          p.owner.modeT = Math.max(p.owner.modeT || 0, 0.4);
        }
        projs.splice(i, 1);
        BGM.sfx('block');
        continue;
      }
      hurtPlayer(false, p.x); return;
    }
  }
}

function drawShots() {
  for (const f of shots) {
    // 🔥 友方火球：橘紅火球＋亮黃核心
    ctx.save();
    ctx.globalAlpha = Math.min(1, f.life * 2);
    ctx.shadowColor = '#ff7b2d'; ctx.shadowBlur = 16;
    ctx.fillStyle = '#ff7b2d';
    ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffe27a';
    ctx.beginPath(); ctx.arc(f.x, f.y, f.r * 0.5, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
}

function drawProjs() {
  for (const p of projs) {
    if (p.kind === 'wave') {
      // 🦁 衝擊波：橙色同心環向前滾動
      ctx.save();
      ctx.globalAlpha = Math.min(1, p.life * 1.5);
      for (let k = 0; k < 3; k++) {
        ctx.strokeStyle = ['#ffdd88', '#ffb347', '#ff7b2d'][k];
        ctx.lineWidth = 4 - k;
        ctx.beginPath();
        ctx.arc(p.x - p.vx * 0.014 * k, p.y, p.r - k * 3, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.restore();
    } else {
      // 🐉 火焰：橘紅火球＋亮黃核心
      ctx.save();
      ctx.globalAlpha = Math.min(1, p.life * 2);
      ctx.shadowColor = '#ff7b2d'; ctx.shadowBlur = 14;
      ctx.fillStyle = '#ff7b2d';
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffe27a';
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 0.5, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
  }
}

/* ---------- 🥅 捕捉網攻擊判定 ---------- */
/* ---------- 🔥 龍座駕火球（友方）：燒小怪、擋退大怪、打斷九頭龍 ---------- */
function updateShots(dt) {
  for (let i = shots.length - 1; i >= 0; i--) {
    const f = shots[i];
    f.x += f.vx * dt;
    f.life -= dt;
    if (Math.random() < 0.7) {   // 火星尾跡
      particles.push({ x: f.x, y: f.y, vx: (Math.random()-0.5)*40, vy: -30 - Math.random()*40,
        life: 0.3, maxLife: 0.3, r: 2 + Math.random()*3, color: Math.random()<0.5?'#ff9a3d':'#ffd54a' });
    }
    let gone = f.life <= 0 || f.x < cam.x - 200 || f.x > cam.x + W / scale + 200;
    const fb = { x: f.x - f.r, y: f.y - f.r, w: f.r * 2, h: f.r * 2 };
    if (!gone) {
      for (const e of enemies) {          // 燒死小怪
        if (e.dead) continue;
        if (overlap(fb, e)) {
          e.dead = true; e.deadT = 0;
          score += 150;
          BGM.sfx('stomp');
          spawnDust(e.x + e.w/2, e.y + e.h/2, 10, '#ff9a3d');
          gone = true;
          break;
        }
      }
    }
    if (!gone) {
      for (const b of beasts) {           // 座駕火球打大怪：只冰凍（殺不死）
        if (b.defeated || b.tamed || b.cool > 0) continue;
        if (overlap(fb, b)) {
          b.freezeT = 2.0;
          score += 50;
          spawnDust(b.x + b.w/2, b.y + b.h/2, 14, '#aee6ff');
          spawnRing(b.x + b.w/2, b.y + b.h/2, '#aee6ff');
          BGM.sfx('capture');
          gone = true;
          break;
        }
      }
    }
    if (!gone && hydra && hydra.alive && !hydra.lying && !hydra.grabbed && !hydra.thrown && !player.mount) {
      const hb2 = { x: hydra.x - 40, y: GROUND_Y - 470, w: 440, h: 480 };
      if (overlap(fb, hb2)) {             // 打斷九頭龍噴火（殺不死）
        hydra.shakeT = 0.5;
        hydra.fireT = Math.max(hydra.fireT, 1.2);
        for (const h of hydra.heads) if (h.alive) h.warn = 0;
        spawnRing(f.x, f.y, '#aef1ff');
        BGM.sfx('block');
        gone = true;
      }
    }
    if (gone) { spawnDust(f.x, f.y, 5, '#ff9a3d'); shots.splice(i, 1); }
  }
}

function updateAttack(dt) {
  if (player.atkT <= 0 || player.atkHitDone) return;
  const t = 0.26 - player.atkT;              // 揮擊經過時間
  if (t < 0.05 || t > 0.2) return;           // 有效判定幀
  const dir = player.facing;
  const zone = { x: player.x + player.w/2 + (dir > 0 ? 4 : -86), y: player.y - 16, w: 82, h: player.h + 30 };
  // 🥅 捕網揮向九頭龍：擋退打斷噴火（殺不死牠，只能用答題逐一滅頭）
  if (hydra && hydra.alive && !hydra.lying && !hydra.grabbed && !hydra.thrown && !player.mount) {
    const hbx = { x: hydra.x - 40, y: GROUND_Y - 470, w: 440, h: 480 };
    if (overlap(zone, hbx)) {
      player.atkHitDone = true;
      hydra.shakeT = 0.5;
      hydra.fireT = Math.max(hydra.fireT, 1.2);   // 打斷即將噴出的火球
      for (const h of hydra.heads) if (h.alive) h.warn = 0;
      spawnRing(hydra.x + 180, GROUND_Y - 220, '#aef1ff');
      spawnDust(hydra.x + 180, GROUND_Y - 220, 12, '#c9a8ff');
      BGM.sfx('block');
      return;
    }
  }
  // 🐉 抓住躺着的九頭巨龍
  if (hydra && hydra.lying && !hydra.grabbed && !hydra.thrown) {
    const hb = { x: hydra.x - 20, y: GROUND_Y - 110, w: 400, h: 120 };
    if (overlap(zone, hb)) {
      player.atkHitDone = true;
      hydra.grabbed = true;
      player.holdingHydra = true;
      spawnDust(hydra.x + 170, GROUND_Y - 40, 10, '#c9a8ff');
      return;
    }
  }
  for (const b of beasts) {                  // 捕捉網揮中魔物：凍結時才能出題
    if (b.defeated || b.cool > 0 || b === player.mount) continue;   // 不會揮中自己的座駕
    if (overlap(zone, b)) {
      player.atkHitDone = true;
      spawnDust(b.x + b.w/2, b.y + b.h/2, 8, '#aef1ff');
      if (b.freezeT > 0) openQuiz(b);        // ❄️ 只有凍結中的魔物可以答題
      else if (player.mount && !b.tamed) {
        // 🏇 座駕攻擊大怪：只冰凍 2 秒（不擊退、不殺死）
        b.freezeT = 2.0;
        score += 50;
        spawnDust(b.x + b.w/2, b.y + b.h/2, 14, '#aee6ff');
        spawnRing(b.x + b.w/2, b.y + b.h/2, '#aee6ff');
        BGM.sfx('capture');
      } else if (!b.tamed) {
        // 🥅 捕網擋退大怪：打不死牠，只能把牠推開一段距離
        b.x += dir * 64;
        b.mode = 'rec';
        b.modeT = 0.7;
        spawnRing(b.x + b.w/2, b.y + b.h/2, '#aef1ff');
        BGM.sfx('block');
      }
      return;
    }
  }
  for (let i = 0; i < enemies.length; i++) {  // 🥅 網住小妖 → 收進網中（不殺死）
    const e = enemies[i];
    if (e.dead) continue;
    if (overlap(zone, e)) {
      // 🥅 抓到小妖 → 變藍色收進網中（可囤多隻），放出後成為伙伴
      if (player.holding.length >= 5) { player.atkHitDone = true; return; }   // 網滿了
      player.holding.push(e.kind);
      enemies.splice(i, 1);
      score += 100;
      BGM.sfx('capture');
      spawnDust(e.x + e.w/2, e.y + e.h/2, 8, '#7db9ff');
      player.atkHitDone = true;
      return;
    }
  }
  for (let i = projs.length - 1; i >= 0; i--) {  // 打掉衝擊波/火焰（九頭龍火球打不掉）
    const p = projs[i];
    if (p.boss) continue;
    if (overlap(zone, { x: p.x - p.r, y: p.y - p.r, w: p.r * 2, h: p.r * 2 })) {
      spawnRing(p.x, p.y, '#aef1ff');
      spawnDust(p.x, p.y, 8, '#ffd166');
      if (p.owner && !p.owner.defeated) {           // 發射的魔物也被震退
        p.owner.x += Math.sign(p.vx) * -48;
        p.owner.modeT = Math.max(p.owner.modeT || 0, 0.4);
      }
      projs.splice(i, 1); score += 50;
      BGM.sfx('block');
      player.atkHitDone = true;
    }
  }
}

/* 🏇 座駕攻擊判定：殺死範圍內小妖，凍結野生大怪（九頭龍免疫，須下騎用伙伴扔牠） */
function mountStrike(m, box) {
  let hit = false;
  for (const e of enemies) {
    if (e.dead) continue;
    if (overlap(box, e)) {
      e.dead = true; e.deadT = 0;
      score += 100;
      BGM.sfx('stomp');
      spawnDust(e.x + e.w/2, e.y + e.h/2, 10, '#ffd54a');
      hit = true;
    }
  }
  for (const b of beasts) {
    if (b.defeated || b.tamed || b === m || b.cool > 0) continue;
    if (overlap(box, b)) {
      b.freezeT = 2.0;                 // ❄️ 只冰凍，殺不死
      score += 50;
      spawnDust(b.x + b.w/2, b.y + b.h/2, 14, '#aee6ff');
      spawnRing(b.x + b.w/2, b.y + b.h/2, '#aee6ff');
      BGM.sfx('capture');
      hit = true;
    }
  }
  return hit;
}

/* ---------- 🥅 放出網中小妖：變藍色伙伴幫忙攻擊一次 ---------- */
function throwHeld() {
  BGM.sfx('throw');
  // 🐉 扔出整條躺着的巨龍 → 跌入遠方火湖
  if (player.holdingHydra) {
    player.holdingHydra = false;
    hydra.grabbed = false;
    hydra.thrown = true;
    hydra.throwT = 0;
    score += 500;
    spawnRing(player.x + player.w/2, player.y, '#c9a8ff');
    return;
  }
  const k = player.holding.shift();       // 取最早抓到的一隻
  const dir = player.facing;
  // 🐍 Boss 戰：對準最近的活龍頭射出小蛇 → 命中出題
  if (k === 'snake' && stage === 5 && hydra && hydra.alive && Math.abs(player.x - hydra.x) < 950) {
    let best = null, bd = 1e9;
    for (const h of hydra.heads) {
      if (!h.alive) continue;
      const hp = hydraHeadPos(h.idx);
      const d = Math.abs(hp.x - player.x);
      if (d < bd) { bd = d; best = h; }
    }
    if (best) {
      snakeShots.push({ x: player.x + player.w/2 + dir * 24, y: player.y - 10, head: best.idx, anim: 0 });
      spawnRing(player.x + player.w/2, player.y, '#7db9ff');
      return;
    }
  }
  const flying = k === 'bat' || k === 'bee';   // 🦇🐝 飛行小怪扔出後飛行追蹤目標
  partners.push({
    kind: k, flying,
    x: player.x + player.w/2 + dir * 24,
    y: flying ? player.y - 10 : GROUND_Y - 24,
    w: 30, h: 24,
    dir, vy: 0, hy: 0, hopT: 0, t: 6, anim: Math.random() * 6
  });
}

function updateThrown(dt) {
  for (let i = thrown.length - 1; i >= 0; i--) {
    const p = thrown[i];
    p.vy += 900 * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.spin += dt * 12 * Math.sign(p.vx);
    p.life -= dt;
    let gone = p.life <= 0;
    // 撞中小妖 → 兩隻一起消滅
    for (const e of enemies) {
      if (e.dead) continue;
      if (p.x > e.x - 10 && p.x < e.x + e.w + 10 && p.y > e.y - 14 && p.y < e.y + e.h + 14) {
        e.dead = true; e.deadT = 0;
        score += 150;
        spawnDust(e.x + e.w/2, e.y + e.h/2, 10, '#ffe27a');
        gone = true;
        break;
      }
    }
    // 撞中魔物 → 直接出題（遠程捕捉！）
    if (!gone) {
      for (const b of beasts) {
        if (b.defeated || b.cool > 0) continue;
        if (p.x > b.x - 8 && p.x < b.x + b.w + 8 && p.y > b.y - 14 && p.y < b.y + b.h + 14) {
          spawnDust(b.x + b.w/2, b.y + b.h/2, 10, '#aef1ff');
          thrown.splice(i, 1);
          openQuiz(b);
          return;
        }
      }
    }
    if (!gone && p.y > GROUND_Y - 6) {          // 落地消散
      spawnDust(p.x, GROUND_Y - 4, 6, '#d9c9a8');
      gone = true;
    }
    if (gone) thrown.splice(i, 1);
  }
}

/* ---------- 💙 藍色伙伴：自動攻擊最近敵人一次 ---------- */
function updatePartners(dt) {
  for (let i = partners.length - 1; i >= 0; i--) {
    const f = partners[i];
    f.anim += dt;
    f.t -= dt;
    // 找最近的目標：小妖（擊殺）或大魔物（凍結 2 秒）
    let target = null, best = 1e9, targetBeast = null;
    for (const e of enemies) {
      if (e.dead) continue;
      const d = Math.abs(e.x - f.x);
      if (d < best) { best = d; target = e; targetBeast = null; }
    }
    for (const b of beasts) {
      if (b.defeated || b.tamed) continue;   // 座駕是自己人
      const d = Math.abs(b.x + b.w/2 - f.x);
      if (d < best) { best = d; target = b; targetBeast = b; }
    }
    if (target) f.dir = (targetBeast ? target.x + target.w/2 : target.x) > f.x ? 1 : -1;

    if (f.flying) {
      // 🐝 飛行伙伴：直接朝目標飛去（無目標則向前盤旋）
      const ty = target ? (targetBeast ? target.y + target.h/2 : target.y - 6) : GROUND_Y - 70;
      const tx = target ? (targetBeast ? target.x + target.w/2 : target.x) : f.x + f.dir * 400;
      const spdX = (f.kind === 'bat' || f.kind === 'bee') ? 430 : 300, spdY = (f.kind === 'bat' || f.kind === 'bee') ? 400 : 220;
      f.x += clamp(tx - f.x, -1, 1) * spdX * dt;
      f.y += clamp(ty - f.y, -1, 1) * spdY * dt + Math.sin(f.anim * 6) * 18 * dt;
    } else {
      // 地面伙伴：快速連跳前進（速度足以追上任何小妖）
      f.hopT -= dt;
      if (f.hopT <= 0 && f.hy <= 0) { f.hopT = 0.45; f.vy = 320; }
      if (f.vy > 0 || f.hy > 0) {
        f.hy += f.vy * dt;
        f.vy -= 1500 * dt;
        if (f.hy <= 0) { f.hy = 0; f.vy = 0; }
      }
      f.x += f.dir * 330 * dt;
      f.y = GROUND_Y - f.h - f.hy;
    }
    // 撞上目標 → 攻擊一次，然後化作光點離開
    if (target) {
      const hit = targetBeast
        ? (Math.abs(target.x + target.w/2 - f.x) < target.w/2 + 16 &&
           f.y + f.h > target.y - 10 && f.y < target.y + target.h + 16)
        : (Math.abs(target.x - f.x) < 30 && Math.abs(target.y - f.y) < 40);
      if (hit) {
        if (targetBeast) {
          // ❄️ 凍結大魔物 1 秒：小紅帽可安全靠近答題
          target.freezeT = 2.0;
          score += 50;
          spawnDust(target.x + target.w/2, target.y + target.h/2, 14, '#aee6ff');
          spawnRing(target.x + target.w/2, target.y + target.h/2, '#aee6ff');
        } else {
          target.dead = true; target.deadT = 0;
          score += 150;
          spawnDust(target.x + target.w/2, target.y + target.h/2, 12, '#7db9ff');
          spawnRing(f.x, f.y, '#7db9ff');
        }
        partners.splice(i, 1);
        continue;
      }
    }
    if (f.t <= 0) {                             // 時間到，離開
      spawnDust(f.x + f.w/2, f.y + f.h/2, 8, '#7db9ff');
      partners.splice(i, 1);
    }
  }
}

function drawThrown() {
  for (const p of thrown) {
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.spin);
    drawCritter(p.kind, 0, 12, 24, { anim: p.spin * 2, dir: 1 });
    ctx.restore();
  }
}

function drawPartners() {
  for (const f of partners) {
    // 藍色光暈
    ctx.save();
    ctx.globalAlpha = 0.35 + Math.sin(time * 6) * 0.1;
    ctx.fillStyle = '#7db9ff';
    ctx.beginPath();
    ctx.arc(f.x + f.w/2, f.y + f.h/2, 20, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    drawCritter(f.kind, f.x + f.w/2, f.y + f.h, 27, { anim: f.anim, dir: f.dir, blue: true, squash: !f.flying && f.hy > 0 ? -0.25 : 0 });
  }
}

function drawCross() {
  if (!cross || cross.got) return;
  const cx = cross.x + cross.w/2;
  const cy = cross.y + cross.h/2 + Math.sin(time * 1.6 + cross.phase) * 3;
  const glow = 0.6 + Math.sin(time * 2.4) * 0.4;
  ctx.save();
  ctx.shadowColor = `rgba(255,230,120,${0.6 + glow * 0.4})`;
  ctx.shadowBlur = 18 + glow * 12;
  ctx.fillStyle = '#ffd54a';
  ctx.fillRect(cx - 4,  cy - 22, 8, 44);   // 直桿
  ctx.fillRect(cx - 16, cy - 12, 32, 8);   // 橫桿
  ctx.fillStyle = '#fff3b0';
  ctx.fillRect(cx - 2,  cy - 22, 4, 44);
  ctx.fillRect(cx - 16, cy - 10, 32, 4);
  ctx.restore();
}

/* ✝️ 新天新地：耶路撒冷城降臨 */
function drawJerusalem() {
  if (state !== 'jerusalem') return;
  const t = Math.min(jeruT / 3.0, 1);          // 0→1 降臨進度
  const ease = 1 - Math.pow(1 - t, 3);
  const cw = Math.min(W * 0.72, 320);
  const ch = cw * 0.55;
  const cx = W / 2;
  const cy = -ch + ease * (H * 0.42 + ch * 0.5);  // 從天上降下

  // 天堂光芒
  ctx.save();
  ctx.fillStyle = `rgba(255,240,180,${0.12 + t * 0.25})`;
  ctx.fillRect(0, 0, W, H);
  ctx.translate(cx, cy);
  for (let i = 0; i < 12; i++) {
    ctx.save();
    ctx.rotate((Math.PI * 2 / 12) * i + time * 0.15);
    ctx.fillStyle = `rgba(255,220,110,${0.10 * t})`;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(cw * 0.9, -cw * 0.08);
    ctx.lineTo(cw * 0.9,  cw * 0.08);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }
  ctx.restore();

  // 城體（金色耶路撒冷）
  ctx.save();
  ctx.translate(cx, cy);
  ctx.shadowColor = 'rgba(255,215,80,0.95)';
  ctx.shadowBlur = 40;
  ctx.fillStyle = '#e8b93c';
  ctx.fillRect(-cw/2, 0, cw, ch * 0.5);                       // 城牆
  ctx.fillStyle = '#f7d774';
  const tw = cw / 5;
  for (let i = -2; i <= 2; i++) {                             // 五座塔樓
    const th2 = ch * (i === 0 ? 0.85 : (Math.abs(i) === 1 ? 0.65 : 0.5));
    ctx.fillRect(i * tw - tw * 0.32, -th2 + ch * 0.5 - ch * 0.5, tw * 0.64, th2);
    ctx.beginPath();                                          // 尖頂
    ctx.moveTo(i * tw - tw * 0.36, -th2);
    ctx.lineTo(i * tw + tw * 0.36, -th2);
    ctx.lineTo(i * tw, -th2 - tw * 0.5);
    ctx.closePath();
    ctx.fill();
  }
  // 城牆垛口
  ctx.fillStyle = '#e8b93c';
  for (let x = -cw/2; x < cw/2; x += 16) ctx.fillRect(x, -8, 9, 8);
  // 城門
  ctx.fillStyle = '#8a5a1a';
  ctx.beginPath();
  ctx.arc(0, ch * 0.5, cw * 0.07, Math.PI, 0);
  ctx.fill();
  ctx.fillRect(-cw * 0.07, ch * 0.5 - 1, cw * 0.14, 2);
  // 城頂十字架
  ctx.fillStyle = '#fff3b0';
  ctx.fillRect(-2, -ch * 0.85 - tw * 0.5 - 26, 4, 30);
  ctx.fillRect(-9, -ch * 0.85 - tw * 0.5 - 20, 18, 4);
  ctx.restore();

  // 標題
  ctx.save();
  ctx.globalAlpha = Math.min(1, t * 1.5);
  ctx.textAlign = 'center';
  ctx.font = `bold ${Math.min(30, W * 0.07)}px system-ui, sans-serif`;
  ctx.fillStyle = '#fff8dd';
  ctx.shadowColor = 'rgba(255,200,60,0.9)';
  ctx.shadowBlur = 20;
  ctx.fillText('✝️ 新天新地 · 聖城耶路撒冷降臨 ✝️', W/2, H * 0.72);
  ctx.font = `500 ${Math.min(15, W * 0.036)}px system-ui, sans-serif`;
  ctx.fillStyle = 'rgba(255,248,221,0.9)';
  ctx.fillText('「看哪，神的帳幕在人間…不再有死亡、悲哀、哭號、疼痛」（啟 21:3-4）', W/2, H * 0.72 + 34);
  ctx.restore();
}

function drawBeast(b) {
  if (b.defeated) return;
  const im = IMGS[b.cfg.beast];
  ctx.save();
  // 🐺🐻🦅🦁🐉 木偶動畫＋攻擊姿態：伏低、站立、俯衝、拍翼
  const kind = b.cfg.beast;
  const bobY = b.flying ? Math.sin(time * 2.4 + b.phase) * 4 : Math.sin(time * 4 + b.phase) * 1.5;
  const dwB = b.flying ? 108 : 92;
  let move = b.flying ? 0.3 : Math.min((b.moveSp || 14) / 95, 1);
  let squash = 0, lean = 0, flap = b.flying ? 1 : 0, partBoost = null;
  const windP = b.mode === 'wind' ? 1 - Math.max(0, b.modeT) / (kind === 'lion' ? 0.75 : kind === 'dragon' ? 0.6 : kind === 'bear' ? 0.5 : 0.42) : 0;
  if (kind === 'wolf') {
    if (b.mode === 'pace') squash = 0.18;                 // 伏低爬行
    if (b.mode === 'wind') squash = 0.18 + windP * 0.25;  // 越壓越低蓄勢
    if (b.mode === 'atk') { lean = 0.22; move = 1.4; }    // 衝刺！
  } else if (kind === 'bear') {
    if (b.mode === 'wind') lean = -0.45 * windP;          // 站起來
    if (b.mode === 'atk') {                               // 熊掌揮下
      lean = -0.42;
      partBoost = { bear_legF2: -1.5 + (1 - Math.max(0, b.modeT) / 0.34) * 2.2, bear_legF1: -0.6 };
    }
  } else if (kind === 'dragon') {
    if (b.mode === 'wind') lean = -0.4 * windP;           // 立起上身
    if (b.mode === 'atk') lean = -0.38;                   // 噴火姿勢
  } else if (kind === 'lion') {
    if (b.mode === 'wind') lean = -0.18 * windP;
    if (b.mode === 'atk') lean = -0.18;
  } else if (kind === 'eagle') {
    if (b.mode === 'wind') flap = 1.6;                    // 用力拍翼拉升
    else if (b.mode === 'atk') { flap = 0.15; lean = 0.35; } // 收翼俯衝
    else if (b.mode === 'rec') flap = 1.5;                // 重新爬升
    else flap = b.climb < -10 ? 1.5 : 0.9;                // 爬升拍大力、下降滑翔
  }
  // 🦁 鬃毛張開（蓄勢/吼叫時頭部周圍爆出火焰色鬃毛）
  if (kind === 'lion' && (b.mode === 'wind' || b.mode === 'atk')) {
    const flare = b.mode === 'wind' ? windP : 1;
    const meta = PARTS.lion;
    const dhL = dwB * (meta ? meta.h / meta.w : 1);
    ctx.save();
    ctx.translate(b.x + b.w/2, b.y + b.h + bobY);
    ctx.scale(b.dir < 0 ? -1 : 1, 1);
    ctx.translate(dwB * 0.30, -dhL * 0.72);
    for (let i = 0; i < 12; i++) {
      const a = i / 12 * Math.PI * 2 + time * 0.6;
      const r1 = dhL * 0.16, r2 = r1 + dhL * 0.14 * flare * (1 + Math.sin(time * 9 + i) * 0.2);
      ctx.strokeStyle = i % 2 ? '#e2603a' : '#f2a03d';
      ctx.lineWidth = 5;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * r1, Math.sin(a) * r1);
      ctx.lineTo(Math.cos(a) * r2, Math.sin(a) * r2);
      ctx.stroke();
    }
    ctx.restore();
  }
  ctx.shadowColor = 'rgba(0,0,0,0.35)';
  ctx.shadowBlur = 8;
  const ok = drawPuppet(b.cfg.beast, b.x + b.w/2, b.y + b.h + bobY, dwB, b.dir, {
    phase: (b.animT || 0) + b.phase,
    move: move,
    air: 0,
    flap: flap,
    lean: lean,
    squash: squash,
    partBoost: partBoost,
    idlePh: b.phase
  });
  ctx.shadowBlur = 0;
  if (!ok && im) {
    ctx.translate(b.x + b.w/2, b.y + b.h + bobY);
    const dw = dwB;
    const dh = dw * (im.height / im.width);
    if (b.dir < 0) ctx.scale(-1, 1);
    ctx.shadowColor = 'rgba(0,0,0,0.35)';
    ctx.shadowBlur = 8;
    ctx.drawImage(im, -dw/2, -dh, dw, dh);
  } else if (!ok) {
    ctx.font = '38px system-ui, -apple-system, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = 'rgba(0,0,0,0.45)';
    ctx.shadowBlur = 8;
    ctx.translate(b.x + b.w/2, b.y + b.h/2 + Math.sin(time * 4 + b.phase) * 2);
    if (b.dir > 0) ctx.scale(-1, 1);
    ctx.fillText(b.cfg.emoji, 0, 0);
  }
  // ❄️ 凍結效果：冰藍罩＋冰晶＋雪花
  if (b.freezeT > 0) {
    const cx = b.x + b.w/2, cy = b.y + b.h/2;
    const rw = Math.max(b.w, 70) * 0.75, rh = Math.max(b.h, 70) * 0.72;
    ctx.save();
    ctx.globalAlpha = Math.min(1, b.freezeT / 0.25) * 0.55;
    const ice = ctx.createRadialGradient(cx, cy, 6, cx, cy, rw);
    ice.addColorStop(0, 'rgba(200,240,255,0.85)');
    ice.addColorStop(1, 'rgba(120,200,255,0.35)');
    ctx.fillStyle = ice;
    ctx.beginPath(); ctx.ellipse(cx, cy, rw, rh, 0, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = Math.min(1, b.freezeT / 0.25) * 0.9;
    ctx.strokeStyle = '#e8fbff';
    ctx.lineWidth = 2;
    for (let i = 0; i < 6; i++) {           // 冰晶六角
      const a = i * Math.PI / 3 + 0.3;
      const ix = cx + Math.cos(a) * rw * 0.55, iy = cy + Math.sin(a) * rh * 0.55;
      ctx.beginPath();
      ctx.moveTo(ix - 5, iy); ctx.lineTo(ix + 5, iy);
      ctx.moveTo(ix - 3, iy - 4); ctx.lineTo(ix + 3, iy + 4);
      ctx.moveTo(ix - 3, iy + 4); ctx.lineTo(ix + 3, iy - 4);
      ctx.stroke();
    }
    ctx.font = '16px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('❄️', cx, b.y - 10);
    ctx.restore();
  }
  ctx.restore();
}


/* ====================== 魔物答題（名偵探學科題庫） ====================== */
const quizEl = {
  overlay:  document.getElementById('quizOverlay'),
  title:    document.getElementById('quizTitle'),
  scene:    document.getElementById('quizScene'),
  q:        document.getElementById('quizQ'),
  opts:     document.getElementById('quizOpts'),
  explain:  document.getElementById('quizExplain'),
  continue: document.getElementById('quizContinue'),
  leave:    document.getElementById('quizLeave')
};
let quizBeast = null, quizSolved = false, quizCustom = null;

function openQuiz(beast, custom) {
  const bank = (custom && !custom.tame) ? custom.bank : (window[beast.cfg.bank] || []);
  if (!bank.length) {           // 題庫異常時直接過關，避免卡關
    if (custom && custom.tame) grantTame(beast);
    else if (custom) { cross.got = true; score += 500; }
    else defeatBeast(beast);
    return;
  }
  quizBeast = beast;
  quizCustom = custom || null;
  quizSolved = false;
  stageStats.asked++;

  const item = bank[Math.floor(Math.random() * bank.length)];

  // 打亂選項顯示順序
  const order = [0, 1, 2, 3];
  for (let i = 3; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }

  quizEl.title.textContent = custom
    ? (custom.hydraHead !== undefined
        ? '🐉 九頭巨龍 · 啟示錄聖言考驗 · 答對即可擊碎龍頭'
        : custom.tame
          ? `${beast.cfg.emoji} ${beast.cfg.beastName}的${beast.cfg.subject}考驗 · 答對即可馴服為座駕🏇`
          : '✝️ 隱藏寶藏 · 啟示錄考驗')
    : `${beast.cfg.emoji} ${beast.cfg.beastName}的${beast.cfg.subject}考驗 · 答對即可擊敗`;
  quizEl.scene.textContent = '📁 ' + (item.scene || beast.cfg.subject + '案件');
  quizEl.q.textContent = item.q;
  quizEl.explain.className = '';
  quizEl.explain.style.display = 'none';
  quizEl.continue.style.display = 'none';
  quizEl.leave.style.display = 'block';
  quizEl.opts.innerHTML = '';

  order.forEach(idx => {
    const btn = document.createElement('button');
    btn.className = 'quizOpt';
    btn.textContent = item.opts[idx];
    btn.addEventListener('click', () => answerQuiz(btn, idx === item.correct, item.explain));
    quizEl.opts.appendChild(btn);
  });

  state = 'quiz';
  quizEl.overlay.classList.add('show');
}

function answerQuiz(btn, isCorrect, explain) {
  if (quizSolved) return;
  if (isCorrect) {
    BGM.sfx('correct');
    quizSolved = true;
    stageStats.correct++;
    btn.classList.add('correct');
    quizEl.opts.querySelectorAll('.quizOpt').forEach(b => b.disabled = true);
    quizEl.explain.className = 'ok';
    quizEl.explain.textContent = quizCustom
      ? (quizCustom.hydraHead !== undefined
          ? '✅ 答對了！聖言擊碎一個龍頭！' + (explain ? '　' + explain : '')
          : quizCustom.tame
            ? `✅ 答對了！魔物成為你的座駕🏇，🔑 取得鑰匙（${keyCount + 1}/${KEYS_NEED}）` + (explain ? '　' + explain : '')
            : '✅ 答對了！✝️ 取得隱藏寶藏「十字架」！' + (explain ? '　' + explain : ''))
      : `✅ 答對了！魔物被擊敗，🔑 取得鑰匙（${keyCount + 1}/${KEYS_NEED}）` + (explain ? '　' + explain : '');
    quizEl.explain.style.display = 'block';
    quizEl.continue.style.display = 'block';
    quizEl.leave.style.display = 'none';
  } else {
    BGM.sfx('wrong');
    btn.classList.add('wrong');
    btn.disabled = true;        // 答錯的選項鎖定，繼續作答直到答對
    stageStats.wrong++;
    lives--;                    // 💔 答錯扣一格心
    if (lives <= 0) {           // 心扣完 → 失敗
      quizEl.overlay.classList.remove('show');
      if (quizBeast && !quizBeast.defeated) quizBeast.cool = 1.0;
      quizBeast = null;
      enterDefeat();
      return;
    }
    quizEl.explain.className = 'bad';
    quizEl.explain.textContent = `❌ 答錯扣一格心（剩 ${lives} 格）！再想想看。提示：` + (explain || '');
    quizEl.explain.style.display = 'block';
  }
}

function closeQuiz(collect) {
  quizEl.overlay.classList.remove('show');
  if (collect && quizBeast) {
    if (quizCustom && quizCustom.hydraHead !== undefined) {
      // 🐉 擊碎一個龍頭
      const hd = hydra.heads[quizCustom.hydraHead];
      if (hd && hd.alive) {
        hd.alive = false;
        hd.deadT = 0.0001;                   // 觸發斷頸倒下動畫
        score += 300;
        const hp = hydraHeadPos(hd.idx);
        spawnDust(hp.x, hp.y, 20, '#ff9a3d');
        spawnRing(hp.x, hp.y, '#ffd54a');
        hydra.shakeT = 0.5;
        if (hydra.heads.every(h => !h.alive)) {
          // 九頭全毀 → 巨龍倒下
          hydra.alive = false;
          hydra.lying = true;
          hydra.shakeT = 1.2;
          score += 1000;
          spawnDust(hydra.x + 160, GROUND_Y - 120, 30, '#b9c6e8');
        }
      }
    } else if (quizCustom && quizCustom.tame) {
      grantTame(quizBeast);     // 🏇 答對 → 馴服為座駕＋掉鑰匙
    } else if (quizCustom) {    // ✝️ 取得十字架寶藏
      quizBeast.got = true;
      score += 500;
      spawnDust(quizBeast.x + 18, quizBeast.y + 24, 14, '#fff3b0');
    } else {
      defeatBeast(quizBeast);
    }
  }
  if (quizBeast) {
    if (quizCustom) { if (!quizBeast.got) quizBeast.cool = 1.0; }
    else if (!quizBeast.defeated) quizBeast.cool = 1.0;   // 離開後短暫避免立即再觸發
  }
  quizBeast = null;
  quizCustom = null;
  state = 'playing';
}

quizEl.continue.addEventListener('click', () => closeQuiz(true));
quizEl.leave.addEventListener('click', () => closeQuiz(false));

function collectCoin(coin) {
  coin.got = true;
  coinCount++;
  score += 50;
  BGM.sfx('coin');
  spawnDust(coin.x, coin.y, 5, '#FFD93B');
}

function defeatBeast(beast) {
  beast.defeated = true;
  beast.soulT = 0;            // 靈魂升天動畫計時
  beast.keySpawned = false;   // 鑰匙是否已彈出
  beast.mistAcc = 0;
  score += 150;
  BGM.sfx('defeat');
  spawnDust(beast.x + beast.w/2, beast.y + beast.h/2, 10, '#ffd54a');
}

/* ---------- 魔物消散：霧氣＋靈魂升天＋鑰匙彈出 ---------- */
function updateSouls(dt) {
  for (const b of beasts) {
    if (!b.defeated || b.soulT === undefined || b.soulT > 2.6) continue;
    b.soulT += dt;
    const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
    // 前 0.9 秒：身軀化為白霧
    if (b.soulT < 0.9) {
      b.mistAcc += dt;
      while (b.mistAcc > 0.06) {
        b.mistAcc -= 0.06;
        particles.push({
          x: cx + (Math.random() - 0.5) * b.w * 0.9,
          y: cy + (Math.random() - 0.5) * b.h * 0.8,
          vx: (Math.random() - 0.5) * 60,
          vy: -30 - Math.random() * 50,
          life: 0.7 + Math.random() * 0.4,
          maxLife: 1.1,
          r: 6 + Math.random() * 8,
          color: 'rgba(235,240,255,0.85)'
        });
      }
    }
    // 0.9 秒時：彈出鑰匙
    if (!b.keySpawned && !b.keyDropped && b.soulT >= 0.9) {
      b.keySpawned = true;
      keyItems.push({ x: cx, y: cy - 10, vy: -320, bounces: 0, state: 'bounce', t: 0, spin: 0, beast: b });
      spawnRing(cx, cy, '#ffe27a');
    }
  }
}

/* ---------- 鑰匙：彈兩下落地 → 等小紅帽拾取，5 秒不取會閃爍氣化 ---------- */
function updateKeyItems(dt) {
  for (let i = keyItems.length - 1; i >= 0; i--) {
    const k = keyItems[i];
    k.t += dt;
    k.spin += dt * 6;
    if (k.state === 'bounce') {
      k.vy += 1400 * dt;
      k.y += k.vy * dt;
      const gy = groundYAt(k.x);
      const floor = (gy !== null ? gy : GROUND_Y) - 16;
      if (k.y >= floor && k.vy > 0) {
        k.y = floor;
        k.vy = -k.vy * 0.52;
        k.bounces++;
        spawnDust(k.x, floor + 6, 4, '#ffe27a');
        if (k.bounces >= 2) { k.state = 'idle'; k.t = 0; }   // 彈兩下後停在地上
      }
      // 彈跳途中碰到小紅帽也可直接拾取
      if (overlap(player, { x: k.x - 14, y: k.y - 14, w: 28, h: 28 })) { collectKey(i, k); continue; }
    } else {
      // 待拾取：5 秒內小紅帽碰到就入手；最後 1.5 秒閃爍，逾時氣化
      if (overlap(player, { x: k.x - 16, y: k.y - 16, w: 32, h: 32 })) {
        collectKey(i, k);
        continue;
      }
      if (k.t > 5) {
        // 氣化消失，魔物重新凝聚（避免鑰匙永遠消失卡關）
        spawnDust(k.x, k.y, 14, 'rgba(235,240,255,0.9)');
        spawnRing(k.x, k.y, '#cfd8ea');
        const b = k.beast;
        if (b && b.defeated) {
          b.defeated = false;
          b.soulT = undefined;
          b.freezeT = 0;
          b.cool = 1.5;
          b.mode = 'pace'; b.modeT = 1;
          spawnDust(b.x + b.w/2, b.y + b.h/2, 16, '#b9c6e8');
        }
        keyItems.splice(i, 1);
      }
    }
  }
}

function collectKey(i, k) {
  keyItems.splice(i, 1);
  keyCount++;
  score += 50;
  BGM.sfx('key');
  spawnRing(k.x, k.y, '#ffd54a');
  spawnDust(k.x, k.y, 8, '#ffd54a');
}

/* ====================== 🐉 第五關最終 Boss：九頭巨龍 ====================== */
const HYDRA_LAKE_X = 5600;      // 遠方火湖位置

function hydraHeadPos(i) {
  const a = (i - 4) / 4;                       // -1（最左）… 1（最右）
  const bob = Math.sin(time * 2 + i * 1.3) * 6;
  return {
    x: hydra.x + 70 + a * 190,
    y: GROUND_Y - 375 - (i % 3) * 40 + Math.abs(a) * 68 + bob
  };
}

function updateHydra(dt) {
  if (!hydra) return;
  const H = hydra;

  if (H.alive || (H.lying && !H.thrown)) {
    // 🧱 巨龍未扔進火湖前，擋住通往旗子的路
    if (player.x + player.w > H.x - 24) {
      player.x = H.x - 24 - player.w;
      if (player.vx > 0) player.vx = 0;
    }
  }

  if (H.alive) {
    // 🔥 九個頭輪流噴火球攻擊小紅帽
    H.fireT -= dt;
    if (H.fireT <= 0) {
      H.fireT = 2.3;
      const alive = H.heads.filter(h => h.alive);
      if (alive.length && Math.abs(player.x - H.x) < 950) {
        alive[H.turn % alive.length].warn = 0.55;   // 先閃紅警告再噴
        H.turn++;
      }
    }
    for (const hd of H.heads) {
      if (!hd.alive) { if (hd.deadT > 0 && hd.deadT < 2) hd.deadT += dt; continue; }
      if (hd.lungeT > 0) hd.lungeT -= dt;
      if (hd.warn <= 0) continue;
      hd.warn -= dt;
      if (hd.warn <= 0) {
        const hp = hydraHeadPos(hd.idx);
        hd.lungeT = 0.24;                    // 噴火瞬間向前撲
        const px = player.x + player.w / 2, py = player.y + player.h / 2;
        const t = Math.max(0.5, Math.abs(px - hp.x) / 300);
        projs.push({
          kind: 'flame', x: hp.x - 30, y: hp.y + 6,
          vx: (px - hp.x) / t,
          vy: (py - hp.y - 0.5 * 520 * t * t) / t,
          r: 14, life: 5, boss: true
        });
        spawnDust(hp.x - 20, hp.y + 4, 8, '#ff9a3d');
      }
    }
    // 🐍 不斷生出小蛇（給小紅帽抓來射龍頭）
    H.snakeT -= dt;
    if (H.snakeT <= 0) {
      H.snakeT = 3.2;
      const near = enemies.filter(e => !e.dead && e.kind === 'snake' && e.x > H.x - 1300).length;
      if (near < 3) {
        const ex = clamp(player.x + (Math.random() < 0.5 ? -1 : 1) * (240 + Math.random() * 220), H.x - 1250, H.x - 90);
        enemies.push({
          kind: 'snake', x: ex, y: GROUND_Y - 20, w: 46, h: 20,
          dir: Math.random() < 0.5 ? -1 : 1, dead: false, deadT: 0,
          anim: Math.random() * 6, phase: Math.random() * 6.28,
          tongueT: 9, lowT: 9, low: 0, hopT: 9, hy: 0, vy: 0
        });
        spawnDust(ex, GROUND_Y - 12, 6, '#b9c6e8');
      }
    }
  } else if (H.thrown && !H.gone) {
    H.throwT += dt;
    if (H.throwT >= 2.4) {                     // 跌入火湖
      H.gone = true;
      for (let j = 0; j < 26; j++) {
        particles.push({
          x: HYDRA_LAKE_X + 40 + Math.random() * 100,
          y: GROUND_Y - 6,
          vx: (Math.random() - 0.5) * 300,
          vy: -Math.random() * 420 - 120,
          life: 0.9 + Math.random() * 0.5, maxLife: 1.4,
          r: 4 + Math.random() * 7,
          color: ['#ff7b2d', '#ffd54a', '#ff5252'][j % 3]
        });
      }
      spawnRing(HYDRA_LAKE_X + 90, GROUND_Y - 10, '#ff7b2d');
    }
  }
}

/* ---------- 🐍 小蛇射向龍頭 → 命中出題 ---------- */
function updateSnakeShots(dt) {
  for (let i = snakeShots.length - 1; i >= 0; i--) {
    const s = snakeShots[i];
    s.anim += dt;
    if (!hydra || !hydra.alive || !hydra.heads[s.head].alive) { snakeShots.splice(i, 1); continue; }
    const hp = hydraHeadPos(s.head);
    const dx = hp.x - s.x, dy = hp.y - s.y;
    const d = Math.hypot(dx, dy) || 1;
    const sp = 640;
    s.x += dx / d * sp * dt;
    s.y += dy / d * sp * dt;
    if (d < 36) {
      snakeShots.splice(i, 1);
      spawnRing(hp.x, hp.y, '#7db9ff');
      openQuiz(hydra, { bank: REVELATION_QS, hydraHead: s.head });
      return;
    }
  }
}

function drawSnakeShots() {
  for (const s of snakeShots) {
    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.rotate(s.anim * 10);
    drawCritter('snake', 0, 8, 26, { anim: s.anim, dir: 1, blue: true });
    ctx.restore();
  }
}

/* ---------- 🔥 遠方火湖 ---------- */
function drawFireLake() {
  const lx = HYDRA_LAKE_X, lw = 220;
  if (lx + lw < cam.x - 100 || lx > cam.x + W / scale + 100) return;
  ctx.save();
  // 湖面火光
  const glow = ctx.createRadialGradient(lx + lw/2, GROUND_Y, 10, lx + lw/2, GROUND_Y, lw * 0.9);
  glow.addColorStop(0, 'rgba(255,120,40,0.55)');
  glow.addColorStop(1, 'rgba(255,120,40,0)');
  ctx.fillStyle = glow;
  ctx.fillRect(lx - lw * 0.4, GROUND_Y - 130, lw * 1.8, 140);
  // 湖體
  ctx.beginPath();
  ctx.ellipse(lx + lw/2, GROUND_Y + 2, lw/2, 16, 0, 0, Math.PI * 2);
  const lava = ctx.createLinearGradient(0, GROUND_Y - 16, 0, GROUND_Y + 18);
  lava.addColorStop(0, '#ffd54a');
  lava.addColorStop(0.5, '#ff7b2d');
  lava.addColorStop(1, '#c62f1b');
  ctx.fillStyle = lava;
  ctx.fill();
  // 火苗
  for (let i = 0; i < 7; i++) {
    const fx = lx + 16 + i * (lw - 32) / 6;
    const fh = 14 + Math.sin(time * 6 + i * 1.7) * 6 + (i % 3) * 5;
    ctx.fillStyle = i % 2 ? '#ff9a3d' : '#ffd54a';
    ctx.beginPath();
    ctx.moveTo(fx - 7, GROUND_Y - 2);
    ctx.quadraticCurveTo(fx, GROUND_Y - 2 - fh * 2, fx + 7, GROUND_Y - 2);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
}

/* ---------- 🐉 九頭巨龍繪製（高解像素材＋蛇形動態頸） ---------- */
function hydraNeckRoot(i) {
  const a = (i - 4) / 4;
  return { x: hydra.x + 100 + a * 55, y: GROUND_Y - 318 + Math.abs(a) * 18 };
}

/* 蛇形頸：貝茲曲線三層描邊平滑漸細，帶波浪蠕動；回傳末端切線角度 */
function drawHydraNeck(root, hp, idx, alpha) {
  const sway = Math.sin(time * 2.2 + idx * 1.3) * 24;
  const cpx = (root.x + hp.x) / 2 + sway;
  const cpy = Math.min(root.y, hp.y) - 44;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  for (const [w, col] of [[17, '#3d2a4e'], [12.5, '#5f4280'], [6.5, '#8a68ac']]) {
    ctx.lineWidth = w;
    ctx.strokeStyle = col;
    ctx.beginPath();
    ctx.moveTo(root.x, root.y);
    ctx.quadraticCurveTo(cpx, cpy, hp.x, hp.y);
    ctx.stroke();
  }
  ctx.restore();
  return Math.atan2(hp.y - cpy, hp.x - cpx);
}

/* 龍頭：高解像圖片，警告時後拉＋張口著火，噴火瞬間前撲 */
function drawHydraHeadImg(hp, hd, tanAng) {
  const im = (hd.warn > 0 && IMGS.hydra_head_fire) ? IMGS.hydra_head_fire : IMGS.hydra_head;
  let back = 0;
  if (hd.warn > 0) back = 16 * Math.sin((0.55 - hd.warn) / 0.55 * Math.PI);        // 後拉蓄勢
  if (hd.lungeT > 0) back = -30 * Math.sin((0.24 - hd.lungeT) / 0.24 * Math.PI);    // 向前撲
  const size = 84;
  ctx.save();
  ctx.translate(hp.x + back, hp.y);
  if (hd.warn > 0) {                                  // 口中火光紅暈
    const wg = ctx.createRadialGradient(-20, 4, 4, -20, 4, 52);
    wg.addColorStop(0, 'rgba(255,110,30,0.85)');
    wg.addColorStop(1, 'rgba(255,110,30,0)');
    ctx.fillStyle = wg;
    ctx.beginPath(); ctx.arc(-20, 4, 52, 0, Math.PI * 2); ctx.fill();
  }
  ctx.rotate(clamp(tanAng, -0.9, 0.9) * 0.45);
  if (im) {
    ctx.drawImage(im, -size * 0.72, -size * 0.55, size, size);
  } else {                                            // 圖未載入的備用頭
    ctx.fillStyle = '#7a4a8e';
    ctx.beginPath(); ctx.ellipse(0, 0, 19, 15, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(-16, 4, 12, 8, 0.15, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffd54a';
    ctx.beginPath(); ctx.arc(-8, -4, 3.4, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

/* 身軀：高解像圖片＋呼吸起伏；anchor = 底部中心 */
function drawHydraBodyImg(cx, bottomY, dh, breath) {
  const im = IMGS.hydra_body;
  if (!im) { drawHydraBody(false); return; }          // 圖未載入 → 舊版備用
  const h = dh * (breath ? 1 + Math.sin(time * 1.6) * 0.016 : 1);
  const w = h * im.width / im.height;
  ctx.drawImage(im, cx - w / 2, bottomY - h, w, h);
}

function drawHydra() {
  if (!hydra || hydra.gone) return;
  const H = hydra;

  // 扔出動畫：高拋物線飛向遠方火湖，旋轉縮小
  if (H.thrown) {
    const t = Math.min(H.throwT / 2.4, 1);
    const x0 = H.x + 170, y0 = GROUND_Y - 60;
    const x1 = HYDRA_LAKE_X + 90, y1 = GROUND_Y - 8;
    const cx = (x0 + x1) / 2, cy = Math.min(y0, y1) - 420;
    const px = (1-t)*(1-t)*x0 + 2*(1-t)*t*cx + t*t*x1;
    const py = (1-t)*(1-t)*y0 + 2*(1-t)*t*cy + t*t*y1;
    const sc = 1 - t * 0.55;
    ctx.save();
    ctx.translate(px, py);
    ctx.rotate(t * 5);
    ctx.scale(sc, sc);
    if (IMGS.hydra_body) {
      const bh = 300, bw = bh * IMGS.hydra_body.width / IMGS.hydra_body.height;
      ctx.drawImage(IMGS.hydra_body, -bw / 2, -bh / 2, bw, bh);
    } else drawHydraBody(true);
    ctx.restore();
    return;
  }

  if (H.lying) {
    // 被打敗躺下的巨龍（可用捕網抓住）
    ctx.save();
    if (H.grabbed) { ctx.translate(0, -14); ctx.rotate(-0.04); }
    const twitch = Math.sin(time * 1.2) * 0.012;      // 偶爾抽搐
    if (IMGS.hydra_body) {
      ctx.translate(H.x + 190, GROUND_Y - 26);
      ctx.rotate(-1.45 + twitch);
      const bh = 340, bw = bh * IMGS.hydra_body.width / IMGS.hydra_body.height;
      ctx.drawImage(IMGS.hydra_body, -bw / 2, -bh, bw, bh);
      ctx.rotate(1.45 - twitch);
      ctx.translate(-(H.x + 190), -(GROUND_Y - 26));
    } else {
      drawHydraBody(true);
    }
    // 九條癱軟的頸散落地上，龍頭無力垂地
    for (const hd of H.heads) {
      const a = (hd.idx - 4) / 4;
      const root = { x: H.x + 90 + a * 60, y: GROUND_Y - 46 };
      const hp = { x: H.x - 30 + hd.idx * 34, y: GROUND_Y - 8 };
      const tan = drawHydraNeck(root, hp, hd.idx, 0.85);
      ctx.save();
      ctx.translate(hp.x, hp.y);
      ctx.rotate(-0.15);
      if (IMGS.hydra_head) ctx.drawImage(IMGS.hydra_head, -58, -30, 72, 72);
      ctx.restore();
    }
    ctx.restore();
    if (!H.grabbed) {
      ctx.save();
      ctx.globalAlpha = 0.6 + Math.sin(time * 5) * 0.3;
      ctx.font = '16px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('🥅', H.x + 170, GROUND_Y - 120);
      ctx.restore();
    }
    return;
  }

  // 正常站立：高解像巨大身軀＋九條蛇形頸＋龍頭
  ctx.save();
  if (H.shakeT > 0) ctx.translate((Math.random() - 0.5) * 8, 0);
  drawHydraBodyImg(H.x + 170, GROUND_Y + 6, 460, true);

  for (const hd of H.heads) {
    const root = hydraNeckRoot(hd.idx);
    if (!hd.alive) {
      // 被毀的頭：頸無力垂落 → 消失，殘樁冒煙
      const dt2 = hd.deadT || 0;
      if (dt2 > 0 && dt2 < 0.9) {
        const droop = dt2 / 0.9;
        const hp0 = hydraHeadPos(hd.idx);
        const hp = { x: hp0.x + (root.x - hp0.x) * droop * 0.5, y: hp0.y + droop * 210 };
        const tan = drawHydraNeck(root, hp, hd.idx, 1 - droop * 0.7);
        ctx.save();
        ctx.globalAlpha = 1 - droop * 0.7;
        ctx.translate(hp.x, hp.y);
        ctx.rotate(1.1 * droop);          // 頭朝下垂
        if (IMGS.hydra_head) ctx.drawImage(IMGS.hydra_head, -69, -53, 96, 96);
        ctx.restore();
      } else {
        // 斷頸殘樁＋煙霧
        ctx.strokeStyle = '#4a3556';
        ctx.lineWidth = 13;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(root.x, root.y);
        ctx.quadraticCurveTo(root.x + a2(hd.idx) * 20, root.y - 34, root.x + a2(hd.idx) * 30, root.y - 52);
        ctx.stroke();
        const puff = 6 + Math.sin(time * 3 + hd.idx) * 2;
        ctx.fillStyle = 'rgba(150,150,160,0.5)';
        ctx.beginPath(); ctx.arc(root.x + a2(hd.idx) * 30, root.y - 58, puff, 0, Math.PI * 2); ctx.fill();
      }
      continue;
    }
    const hp = hydraHeadPos(hd.idx);
    const tan = drawHydraNeck(root, hp, hd.idx, 1);
    drawHydraHeadImg(hp, hd, tan);
  }

  // 剩餘龍頭數
  const left = H.heads.filter(h => h.alive).length;
  ctx.save();
  ctx.font = 'bold 20px sans-serif';
  ctx.textAlign = 'center';
  ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 6;
  ctx.fillStyle = '#ffd54a';
  ctx.fillText(`🐉 × ${left}`, H.x + 170, GROUND_Y - 470);
  ctx.restore();
  ctx.restore();
}

function a2(i) { return (i - 4) / 4; }

/* 舊版備用龍身（圖片未載入時使用） */
function drawHydraBody(lying) {
  const H = hydra;
  if (lying) {
    const bx = H.thrown ? 0 : H.x + 170, by = H.thrown ? 0 : GROUND_Y - 34;
    ctx.fillStyle = '#5a3a6e';
    ctx.beginPath(); ctx.ellipse(bx, by, 190, 44, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#8a6a9e';
    ctx.beginPath(); ctx.ellipse(bx, by + 14, 170, 26, 0, 0, Math.PI * 2); ctx.fill();
    return;
  }
  const bx = H.x + 160, baseY = GROUND_Y;
  const bodyG = ctx.createLinearGradient(bx - 150, 0, bx + 150, 0);
  bodyG.addColorStop(0, '#6a4a7e');
  bodyG.addColorStop(1, '#4a3358');
  ctx.fillStyle = bodyG;
  ctx.beginPath(); ctx.ellipse(bx, baseY - 190, 135, 205, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#8a6a9e';
  ctx.beginPath(); ctx.ellipse(bx - 46, baseY - 170, 74, 165, 0.06, 0, Math.PI * 2); ctx.fill();
}


function checkGoal() {
  if (!goal) return;
  if (player.x + player.w > goal.x && player.x < goal.x + 60) {
    if (player.y + player.h > goal.y) {
      if (keyCount >= KEYS_NEED) {
        // 🚩 集滿鑰匙 → 拉下旗子過關，進入結算
        score += 1000;
        allStats.push({ stage, ...stageStats, cfg: TH() });
        if (stage >= STAGES.length) {
          if (cross && cross.got) {
            // ✝️ 持有十字架 → 觸發新天新地
            state = 'jerusalem';
            jeruT = 0;
            playFanfare();
          } else {
            state = 'win';
          }
        } else {
          state = 'stageclear';
        }
      } else {
        failReason = 'nokey';   // 🔑 鑰匙不足 → 過關失敗
        state = 'gameover';
      }
    }
  }
}

function drawSouls() {
  for (const b of beasts) {
    if (!b.defeated || b.soulT === undefined || b.soulT > 2.6) continue;
    const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
    const t = b.soulT;

    // 殘留影（前 0.9s 逐漸透明的身軀輪廓）
    if (t < 0.9) {
      ctx.save();
      ctx.globalAlpha = (1 - t / 0.9) * 0.35;
      ctx.translate(cx, b.y + b.h);
      ctx.scale(1 + t * 0.3, 1 - t * 0.2);
      ctx.beginPath();
      ctx.ellipse(0, -b.h / 2, b.w / 2, b.h / 2, 0, 0, Math.PI * 2);
      ctx.fillStyle = '#dfe8ff';
      ctx.fill();
      ctx.restore();
    }

    // 靈魂升天：0.35s 後發光小靈魂向上飄
    if (t > 0.35) {
      const st = t - 0.35;
      const sy = cy - st * 130;
      const sx = cx + Math.sin(st * 5) * 10;
      const fade = Math.max(0, 1 - Math.max(0, st - 1.2) / 1.0);
      const appear = Math.min(1, st / 0.25);
      const a = fade * appear;

      // 升天光柱
      ctx.save();
      ctx.globalAlpha = a * 0.35;
      const beam = ctx.createLinearGradient(0, sy + 40, 0, sy - 160);
      beam.addColorStop(0, 'rgba(190,225,255,0.9)');
      beam.addColorStop(1, 'rgba(190,225,255,0)');
      ctx.fillStyle = beam;
      ctx.fillRect(sx - 14, sy - 160, 28, 200);
      ctx.restore();

      ctx.save();
      ctx.globalAlpha = a;
      ctx.translate(sx, sy);
      // 光暈
      const glow = ctx.createRadialGradient(0, 0, 2, 0, 0, 26);
      glow.addColorStop(0, 'rgba(255,255,240,0.95)');
      glow.addColorStop(1, 'rgba(160,210,255,0)');
      ctx.fillStyle = glow;
      ctx.beginPath(); ctx.arc(0, 0, 26, 0, Math.PI * 2); ctx.fill();
      // 小翅膀
      const flap = Math.sin(time * 14) * 0.5;
      ctx.fillStyle = 'rgba(255,255,255,0.95)';
      for (const s of [-1, 1]) {
        ctx.save();
        ctx.translate(s * 9, -2);
        ctx.rotate(s * (-0.5 + flap * 0.4));
        ctx.beginPath();
        ctx.ellipse(s * 7, 0, 8, 4, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
      // 靈魂身體（小幽靈）
      ctx.beginPath();
      ctx.arc(0, -3, 9, Math.PI, 0);
      ctx.lineTo(9, 6);
      ctx.quadraticCurveTo(4.5, 2, 0, 6);
      ctx.quadraticCurveTo(-4.5, 10, -9, 6);
      ctx.closePath();
      ctx.fillStyle = '#f4faff';
      ctx.fill();
      // 眼睛
      ctx.fillStyle = '#5a7ba6';
      ctx.beginPath(); ctx.arc(-3, -4, 1.4, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(3, -4, 1.4, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
  }
}

function drawKeyItems() {
  for (const k of keyItems) {
    // 待拾取最後 1.5 秒閃爍提醒
    if (k.state === 'idle' && k.t > 3.5 && Math.floor(k.t * 8) % 2 === 0) continue;

/* ====================== 特別音效：新天新地號角 ====================== */
let audioCtx = null;
function playFanfare() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    audioCtx.resume();
    const now = audioCtx.currentTime;
    // 上行號角琶音
    const notes = [261.6, 329.6, 392.0, 523.3, 659.3, 784.0, 1046.5];
    notes.forEach((f, i) => {
      const t = now + i * 0.16;
      [0, 4].forEach(det => {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = i < 4 ? 'triangle' : 'sine';
        o.frequency.value = f * (1 + det * 0.001);
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(0.22, t + 0.03);
        g.gain.exponentialRampToValueAtTime(0.001, t + 1.4);
        o.connect(g).connect(audioCtx.destination);
        o.start(t); o.stop(t + 1.5);
      });
    });
    // 終止式和弦
    [523.3, 659.3, 784.0, 1046.5].forEach(f => {
      const t = now + notes.length * 0.16 + 0.1;
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = 'triangle';
      o.frequency.value = f;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.16, t + 0.05);
      g.gain.exponentialRampToValueAtTime(0.001, t + 2.2);
      o.connect(g).connect(audioCtx.destination);
      o.start(t); o.stop(t + 2.3);
    });
    // 天鈴聲
    for (let i = 0; i < 12; i++) {
      const t = now + 0.3 + i * 0.22;
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = 'sine';
      o.frequency.value = 1568 + Math.random() * 1200;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.05, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.6);
      o.connect(g).connect(audioCtx.destination);
      o.start(t); o.stop(t + 0.7);
    }
  } catch (e) { /* 音效不可用時靜默 */ }
}

/* 🥅 捕網防守：大怪攻擊瞬間揮網 → 攻擊抵消，雙方彈開一段距離 */
function blockAttack(b) {
  if (player.atkT <= 0) return false;      // 沒在揮網 → 擋不了
  const dir = Math.sign((player.x + player.w / 2) - (b.x + b.w / 2)) || 1;
  player.vx = dir * 340;                   // 小紅帽向後彈開
  player.vy = -180;
  player.onGround = false;
  player.hurtTimer = 0.5;                  // 短暫硬直（不受傷）
  b.x -= dir * 72;                         // 魔物也被震退
  b.dir = -dir;
  b.mode = 'rec';                          // 攻勢被瓦解 → 收招硬直
  b.modeT = 1.0;
  const mx = (player.x + player.w / 2 + b.x + b.w / 2) / 2;
  spawnRing(mx, player.y + 6, '#aef1ff');
  spawnDust(mx, player.y + 10, 10, '#cfe8ff');
  BGM.sfx('block');
  return true;
}
