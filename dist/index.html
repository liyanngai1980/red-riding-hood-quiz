function hurtPlayer(fell, srcX) {
  if (player.hurtTimer > 0 && !fell) return;
  // 🏇 座駕擋災：被攻擊時座駕消失（變回野性跑掉），小紅帽不扣心
  if (player.mount && !fell) {
    const m = player.mount;
    m.tamed = false;
    m.cool = 2.5;
    player.mounts = (player.mounts || []).filter(x => x !== m);   // 從座駕名單移除
    m.mode = 'rec';
    m.modeT = 1.2;
    player.mount = null;
    player.hurtTimer = 1.5;
    player.vy = -240;
    player.onGround = false;
    spawnRing(m.x + m.w/2, m.y + m.h/2, '#ffe9a8');
    spawnDust(m.x + m.w/2, m.y + m.h/2, 16, '#ffd54a');
    BGM.sfx('hurt');
    return;
  }
  lives--;
  if (lives <= 0) {
    spawnDust(player.x + player.w/2, player.y + player.h/2, 16, '#ff8a8a');
    spawnRing(player.x + player.w/2, player.y + player.h/2, '#ff5252');
    enterDefeat();          // 💔 倒下哭泣 → Continue / GAME OVER 選擇
    return;
  }
  if (fell) {
    respawn();          // 跌落深谷才需要回到檢查點
    return;
  }
  // 被攻擊：扣一格心，面露痛苦、閃動＋由攻擊來源反方向彈開幾步
  player.hurtTimer = 1.6;
  const away = (srcX === undefined) ? -player.facing
             : ((player.x + player.w / 2) < srcX ? -1 : 1);
  player.vx = away * 380;             // 向後彈開幾步
  player.vy = -240;                   // 稍微彈起
  player.onGround = false;
  BGM.sfx('hurt');
  spawnDust(player.x + player.w/2, player.y + player.h/2, 6, '#ff8a8a');
}

function spawnDust(x, y, n, color) {
  for (let i = 0; i < n; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 260,
      vy: -Math.random() * 220 - 40,
      life: 0.5 + Math.random() * 0.3,
      maxLife: 0.8,
      r: 2 + Math.random() * 3,
      color: color || '#ffffff'
    });
  }
}

function spawnRing(x, y, color) {
  rings.push({ x, y, r: 6, maxR: 62, life: 0.42, maxLife: 0.42, color });
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 900 * dt;
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
  for (let i = rings.length - 1; i >= 0; i--) {
    const r = rings[i];
    r.life -= dt;
    r.r += (r.maxR - r.r) * Math.min(1, dt * 12);
    if (r.life <= 0) rings.splice(i, 1);
  }
}

function updateCamera(dt) {
  const viewW = W / scale;
  const viewH = H / scale;

  let tx = player.x + player.w/2 - viewW * 0.4;
  tx = clamp(tx, 0, Math.max(0, WORLD_W - viewW));
  cam.x += (tx - cam.x) * Math.min(1, dt * 7);

  let ty = GROUND_Y - viewH * 0.82;
  const desired = player.y - viewH * 0.45;
  if (ty > desired) ty = desired;
  cam.y += (ty - cam.y) * Math.min(1, dt * 5);
}

function update(dt) {
  time += dt;

  if (state === 'playing') {
    readInput();
    updatePlayer(dt);
    updateAttack(dt);
    updateEnemies(dt);
    updateBeasts(dt);
    updateProjs(dt);
    updateShots(dt);
    updateThrown(dt);
    updatePartners(dt);
    updateCoins(dt);
    updateCross();
    updateSouls(dt);
    updateKeyItems(dt);
    updateHydra(dt);
    updateSnakeShots(dt);
    checkGoal();
    if (lives <= 0) enterDefeat();   // 🛟 保險：任何漏網的致死路徑都會彈出重生提示
  }

  if (state === 'jerusalem') {
    jeruT += dt;
    if (jeruT > 3.4) state = 'win';   // 城降下後進入總結算
  }

  updateParticles(dt);
  updateCamera(dt);
}

/* ====================== 繪圖 ====================== */
function drawCloud(x, y, s) {
  ctx.fillStyle = 'rgba(255,255,255,0.92)';
  ctx.beginPath();
  ctx.arc(x,        y,        22*s, 0, Math.PI*2);
  ctx.arc(x + 26*s, y - 12*s, 28*s, 0, Math.PI*2);
  ctx.arc(x + 56*s, y,        22*s, 0, Math.PI*2);
  ctx.arc(x + 28*s, y + 10*s, 24*s, 0, Math.PI*2);
  ctx.fill();
}

function drawClouds() {
  const wrap = W + 600;
  for (let i = 0; i < 9; i++) {
    let cx = ((i * 293 + 120) - cam.x * 0.35) % wrap;
    if (cx < 0) cx += wrap;
    cx -= 300;
    const cy = 30 + ((i * 89) % 140);
    const s  = (0.55 + ((i * 17) % 8) / 12) * Math.max(0.7, scale * 0.75);
    drawCloud(cx, cy, s);
  }
}

function drawBackgroundWorld() {
  const th = TH();
  const hills = [180, 760, 1500, 2280, 3050, 3900, 4700, 5400];
  for (let i = 0; i < hills.length; i++) {
    const hx = hills[i];
    const hw = 240 + (i % 3) * 90;
    const hh = 110 + (i % 4) * 40;
    ctx.fillStyle = i % 2 ? th.hill1 : th.hill2;
    ctx.beginPath();
    ctx.ellipse(hx, GROUND_Y + 10, hw, hh, 0, Math.PI, 0);
    ctx.fill();
  }
  for (let i = 0; i < hills.length; i++) {
    const bx = hills[i] + 160;
    ctx.fillStyle = th.hill2;
    ctx.beginPath();
    ctx.arc(bx,      GROUND_Y, 26, Math.PI, 0);
    ctx.arc(bx + 30, GROUND_Y, 20, Math.PI, 0);
    ctx.arc(bx - 28, GROUND_Y, 18, Math.PI, 0);
    ctx.fill();
  }
}

function drawPlatform(p) {
  const th = TH();
  if (p.kind === 'ground') {
    ctx.fillStyle = th.dirt;
    ctx.fillRect(p.x, p.y, p.w, p.h);
    ctx.fillStyle = 'rgba(0,0,0,0.08)';
    for (let i = 0; i < p.w; i += 44) {
      ctx.fillRect(p.x + i + 8, p.y + 34, 22, 12);
      ctx.fillRect(p.x + i + 28, p.y + 74, 20, 12);
    }
    ctx.fillStyle = th.grass;
    ctx.fillRect(p.x, p.y, p.w, 20);
    ctx.fillStyle = th.grassTop;
    ctx.fillRect(p.x, p.y, p.w, 8);
    ctx.fillStyle = th.grass;
    for (let i = 0; i < p.w; i += 22) {
      ctx.beginPath();
      ctx.arc(p.x + i + 11, p.y + 20, 8, Math.PI, 0);
      ctx.fill();
    }
  } else if (p.kind === 'cloud') {
    // ☁️ 雲端平台（十字架寶藏所在）
    ctx.save();
    ctx.shadowColor = 'rgba(255,255,255,0.9)';
    ctx.shadowBlur = 16;
    ctx.fillStyle = 'rgba(255,255,255,0.95)';
    ctx.beginPath();
    ctx.ellipse(p.x + p.w/2, p.y + 10, p.w/2, 14, 0, 0, Math.PI*2);
    ctx.arc(p.x + 30, p.y + 4, 16, 0, Math.PI*2);
    ctx.arc(p.x + p.w/2, p.y, 20, 0, Math.PI*2);
    ctx.arc(p.x + p.w - 30, p.y + 4, 16, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  } else {
    ctx.fillStyle = '#7a4a1f';
    roundRect(p.x, p.y, p.w, p.h, 6); ctx.fill();
    ctx.fillStyle = th.grass;
    roundRect(p.x, p.y, p.w, 9, 5); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.16)';
    roundRect(p.x + 4, p.y + 3, p.w - 8, 4, 2); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    for (let i = 22; i < p.w - 8; i += 24) {
      ctx.fillRect(p.x + i, p.y + 10, 2, p.h - 12);
    }
  }
}

function drawCoin(c) {
  if (c.got) return;
  const t = time * 3.2 + c.phase;
  const squish = Math.abs(Math.cos(t));
  const rx = 3 + squish * 9;
  const ry = 11;
  const cx = c.x, cy = c.y + Math.sin(t * 0.7) * 3;

  ctx.save();
  ctx.shadowColor = 'rgba(255,200,0,0.75)';
  ctx.shadowBlur = 12;
  ctx.fillStyle = '#FFC93C';
  ctx.beginPath();
  ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();

  ctx.fillStyle = '#FFE894';
  ctx.beginPath();
  ctx.ellipse(cx, cy, rx * 0.55, ry * 0.6, 0, 0, Math.PI*2);
  ctx.fill();
}

/* ---------- 🌺🐝🐕🐸🐍 小妖繪製（程序化卡通造型） ----------
   st = { anim, dir, tongue, blue, squash } */
function drawCritter(kind, cx, yBottom, s, st) {
  const anim = st.anim || 0, dir = st.dir || 1;
  const him = IMGS['crit_' + kind];
  if (him) {
    /* 🎨 高解像宮崎駿風小怪：呼吸伸縮＋行走彈跳＋身體前傾，動態傳神 */
    const fly = kind === 'bat' || kind === 'bee';
    const bob = fly ? Math.sin(anim * 10) * 0.10 : Math.abs(Math.sin(anim * 5.2)) * 0.055;
    const tilt = Math.sin(anim * 3.1) * (fly ? 0.10 : 0.06);
    const sq = 1 + Math.sin(anim * 5.2) * (fly ? 0.05 : 0.035);
    const w = s * (him.width / him.height) * 1.75, h = s * 1.75;
    ctx.save();
    ctx.translate(cx, yBottom);
    ctx.scale(dir, 1);
    if (st.blue) ctx.filter = 'hue-rotate(150deg) saturate(1.35) brightness(1.06)';   // 藍色=伙伴
    ctx.rotate(tilt);
    ctx.scale(1 / sq, sq);
    ctx.drawImage(him, -w / 2, -h - bob * s, w, h);
    if (kind === 'dog') {
      /* 🐕 四條腿步行循環：前後腿交錯前擺，遮蓋靜態圖的腿 */
      const u = s / 30, ph = anim * 9;
      const leg = (off, phase, col) => {
        const sw = Math.sin(ph + phase) * 0.62;
        ctx.strokeStyle = col;
        ctx.lineWidth = 3.4 * u;
        ctx.lineCap = 'round';
        const hx = off * u, hy = -9 * u;
        ctx.beginPath();
        ctx.moveTo(hx, hy);
        ctx.lineTo(hx + Math.sin(sw) * 7 * u, hy + 10.5 * u);
        ctx.stroke();
      };
      leg(-8, 0, '#7a5230'); leg(7, Math.PI, '#7a5230');        // 遠側兩腿（深色）
      leg(-6, Math.PI, '#b98554'); leg(9, 0, '#b98554');        // 近側兩腿（淺色）
    }
    ctx.restore();
    return;
  }
  ctx.save();
  ctx.translate(cx, yBottom);
  ctx.scale(dir, 1);

  if (kind === 'piranha') {
    /* 🌺 食人花：搖擺的莖＋大紅頭，行走時伸出舌頭（藍色=伙伴） */
    const u = s / 44;
    const sway = Math.sin(anim * 2.2) * 5 * u;
    const stemC = st.blue ? '#3a7ab5' : '#3e8e41';
    const leafC = st.blue ? '#5a9bd8' : '#4caf50';
    const headC = st.blue ? '#3f9be0' : '#d63a2f';
    ctx.strokeStyle = stemC;
    ctx.lineWidth = 6 * u;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(sway * 0.4, -20 * u, sway, -34 * u);
    ctx.stroke();
    ctx.fillStyle = leafC;   // 葉子
    ctx.beginPath(); ctx.ellipse(-9 * u, -13 * u, 8 * u, 3.5 * u, -0.5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse( 9 * u, -18 * u, 8 * u, 3.5 * u, 0.5, 0, Math.PI*2); ctx.fill();
    const hx = sway, hy = -40 * u;
    // 舌頭（頭後面伸出）
    if (st.tongue > 0) {
      const tl = st.tongue * 20 * u;
      ctx.strokeStyle = '#ff8fa3';
      ctx.lineWidth = 4 * u;
      ctx.beginPath();
      ctx.moveTo(hx + 8 * u, hy + 3 * u);
      ctx.quadraticCurveTo(hx + 8 * u + tl * 0.6, hy + 5 * u + Math.sin(anim * 20) * 2 * u, hx + 8 * u + tl, hy + 2 * u);
      ctx.stroke();
      ctx.fillStyle = '#ff6b87';
      ctx.beginPath(); ctx.arc(hx + 8 * u + tl, hy + 2 * u, 3 * u, 0, Math.PI*2); ctx.fill();
    }
    // 頭
    ctx.fillStyle = headC;
    ctx.beginPath(); ctx.arc(hx, hy, 13 * u, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff';      // 白點
    [[-5,-4],[4,-7],[7,3],[-3,5]].forEach(p => {
      ctx.beginPath(); ctx.arc(hx + p[0]*u, hy + p[1]*u, 1.8*u, 0, Math.PI*2); ctx.fill();
    });
    // 嘴巴（黑色橫縫＋白牙）
    ctx.fillStyle = '#5e0f0f';
    ctx.beginPath(); ctx.ellipse(hx + 6*u, hy + 3*u, 6.5*u, 3.6*u, 0.15, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff';
    for (let i = 0; i < 3; i++) {
      ctx.beginPath();
      ctx.moveTo(hx + (2+i*4)*u, hy + 1*u);
      ctx.lineTo(hx + (4+i*4)*u, hy + 1*u);
      ctx.lineTo(hx + (3+i*4)*u, hy + 4.5*u);
      ctx.closePath(); ctx.fill();
    }
    // 眼睛
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(hx + 2*u, hy - 8*u, 3.4*u, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#1a1a1a';
    ctx.beginPath(); ctx.arc(hx + 3*u, hy - 8*u, 1.7*u, 0, Math.PI*2); ctx.fill();
  } else if (kind === 'bat') {
    /* 🦇 蝙蝠：鼓翼低飛（藍色=伙伴） */
    const u = s / 26;
    const flap = Math.sin(anim * 18);
    const bodyC = st.blue ? '#5a8ec4' : '#6b4a7a';
    const wingC = st.blue ? '#3a6a9a' : '#4a3055';
    // 雙翼上下鼓動
    for (const ws of [-1, 1]) {
      ctx.save();
      ctx.translate(-1 * u, -12 * u);
      ctx.rotate(ws * (0.25 + flap * 0.55));
      ctx.fillStyle = wingC;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(ws * 10 * u, -8 * u, ws * 17 * u, -4 * u);
      ctx.quadraticCurveTo(ws * 13 * u, 1 * u, ws * 15 * u, 4 * u);
      ctx.quadraticCurveTo(ws * 8 * u, 2 * u, ws * 6 * u, 5 * u);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    ctx.fillStyle = bodyC;                       // 身體
    ctx.beginPath(); ctx.ellipse(0, -9 * u, 7.5 * u, 6.5 * u, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath();                             // 大耳朵
    ctx.moveTo(-5 * u, -13 * u); ctx.lineTo(-7 * u, -21 * u); ctx.lineTo(-1.5 * u, -15 * u);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(5 * u, -13 * u); ctx.lineTo(7 * u, -21 * u); ctx.lineTo(1.5 * u, -15 * u);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#fff';                      // 眼
    ctx.beginPath(); ctx.arc(2.5 * u, -11 * u, 2.4 * u, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#222';
    ctx.beginPath(); ctx.arc(3.3 * u, -11 * u, 1.2 * u, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff';                      // 小尖牙
    ctx.beginPath();
    ctx.moveTo(4 * u, -6.5 * u); ctx.lineTo(5.4 * u, -6.5 * u); ctx.lineTo(4.7 * u, -4.4 * u);
    ctx.closePath(); ctx.fill();
  } else if (kind === 'bee') {
    /* 🐝 蜜蜂後備畫法：黃黑條紋圓身體＋拍翼（藍色=伙伴） */
    const u = s / 26;
    const flap = Math.sin(anim * 22);
    const bodyC = st.blue ? '#5a8ec4' : '#f2c234';
    const stripeC = st.blue ? '#2b5f8f' : '#5a4520';
    // 翅膀
    for (const ws of [-0.6, 1]) {
      ctx.save();
      ctx.translate(-2 * u, -14 * u);
      ctx.rotate(ws * (0.5 + flap * 0.5));
      ctx.fillStyle = 'rgba(220,240,255,0.75)';
      ctx.beginPath();
      ctx.ellipse(6 * u, 0, 8 * u, 4 * u, 0.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
    // 圓身體＋條紋
    ctx.fillStyle = bodyC;
    ctx.beginPath(); ctx.ellipse(0, -8 * u, 11 * u, 8.5 * u, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = stripeC;
    ctx.beginPath(); ctx.ellipse(2 * u, -8 * u, 2.6 * u, 7.6 * u, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(-4 * u, -8 * u, 2.6 * u, 8 * u, 0, 0, Math.PI * 2); ctx.fill();
    // 眼睛
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(7 * u, -11 * u, 3 * u, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#1a1a1a';
    ctx.beginPath(); ctx.arc(8 * u, -11 * u, 1.6 * u, 0, Math.PI * 2); ctx.fill();
    // 尾針
    ctx.strokeStyle = stripeC; ctx.lineWidth = 1.6 * u;
    ctx.beginPath(); ctx.moveTo(-11 * u, -8 * u); ctx.lineTo(-15 * u, -6 * u); ctx.stroke();
  } else if (kind === 'frog') {
    /* 🐸 青蛙（blue=true 時變藍色伙伴） */
    const u = s / 24;
    const sq = st.squash || 0;
    const body  = st.blue ? '#3f9be0' : '#4caf50';
    const dark  = st.blue ? '#2b7ab8' : '#3e8e41';
    const belly = st.blue ? '#cfeafb' : '#d7f0c2';
    ctx.save();
    ctx.scale(1 + sq * 0.3, 1 - sq * 0.25);
    ctx.fillStyle = dark;         // 後腿（坐著）
    ctx.beginPath(); ctx.ellipse(-8*u, -5*u, 6.5*u, 5*u, 0.3, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse( 8*u, -5*u, 6.5*u, 5*u, -0.3, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = body;         // 身體
    ctx.beginPath(); ctx.ellipse(0, -9*u, 11*u, 8.5*u, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = belly;        // 肚皮
    ctx.beginPath(); ctx.ellipse(2*u, -6.5*u, 6.5*u, 5*u, 0, 0, Math.PI*2); ctx.fill();
    // 眼睛（凸眼）
    [[-3.5, -18.5], [4.5, -18.5]].forEach(p => {
      ctx.fillStyle = body;
      ctx.beginPath(); ctx.arc(p[0]*u, p[1]*u, 3.6*u, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(p[0]*u, p[1]*u, 2.6*u, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#1a1a1a';
      ctx.beginPath(); ctx.arc(p[0]*u + 0.8*u, p[1]*u, 1.3*u, 0, Math.PI*2); ctx.fill();
    });
    // 微笑
    ctx.strokeStyle = dark;
    ctx.lineWidth = 1.4 * u;
    ctx.beginPath(); ctx.arc(1*u, -11*u, 4*u, 0.3, Math.PI - 0.3); ctx.stroke();
    ctx.restore();
  } else if (kind === 'snake') {
    /* 🐍 蛇：蠕動伸縮爬行（身體節距隨蠕動收放） */
    const u = s / 20;
    const stretch = 1 + 0.22 * Math.sin(anim * 2.4);   // 伸縮
    const n = 7;
    for (let i = n; i >= 1; i--) {
      const px = -i * 6.5 * u * stretch;
      const py = -4.5 * u + Math.sin(anim * 3 - i * 0.85) * 2.8 * u;
      ctx.fillStyle = i % 2 ? (st.blue ? '#2b5f8f' : '#5d8a3c') : (st.blue ? '#5a9bd8' : '#6fa04a');
      ctx.beginPath(); ctx.arc(px, py, Math.max(4.6 - i * 0.38, 2.4) * u, 0, Math.PI*2); ctx.fill();
    }
    // 頭
    const hx = 2 * u, hy = -4.5 * u + Math.sin(anim * 3) * 2.8 * u;
    ctx.fillStyle = st.blue ? '#6fb3e8' : '#7ab557';
    ctx.beginPath(); ctx.ellipse(hx, hy, 7 * u, 5.5 * u, 0, 0, Math.PI*2); ctx.fill();
    // 吐信（紅色叉舌，快速閃動）
    if (Math.sin(anim * 5) > 0.2) {
      ctx.strokeStyle = '#e03434';
      ctx.lineWidth = 1.6 * u;
      ctx.beginPath();
      ctx.moveTo(hx + 6.5*u, hy + 1*u); ctx.lineTo(hx + 11*u, hy + 1*u);
      ctx.moveTo(hx + 11*u, hy + 1*u); ctx.lineTo(hx + 13.5*u, hy - 1*u);
      ctx.moveTo(hx + 11*u, hy + 1*u); ctx.lineTo(hx + 13.5*u, hy + 3*u);
      ctx.stroke();
    }
    ctx.fillStyle = '#fff';       // 眼
    ctx.beginPath(); ctx.arc(hx + 1*u, hy - 2.5*u, 2.2*u, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#1a1a1a';    // 直瞳
    ctx.beginPath(); ctx.ellipse(hx + 1.8*u, hy - 2.5*u, 0.7*u, 1.4*u, 0, 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

function drawEnemy(e) {
  ctx.save();
  ctx.translate(e.x + e.w/2, e.y + e.h);
  if (e.dead) {
    ctx.globalAlpha = Math.max(0, 1 - e.deadT * 2.5);
    ctx.scale(1.2, 0.3);
  }
  ctx.restore();
  drawCritter(e.kind, e.x + e.w/2, e.y + e.h, e.h * 1.3, {
    anim: e.anim, dir: e.dir,
    tongue: e.tongue || 0,
    squash: e.kind === 'frog' ? (e.hy > 0 ? -0.25 : (e.hopT < 0.3 ? 0.5 : 0)) : 0
  });
}

function drawGoal() {
  if (!goal) return;
  const gx = goal.x, gy = goal.y, gh = goal.h;

  ctx.fillStyle = '#cfd8dc';
  ctx.fillRect(gx, gy, 7, gh);
  ctx.fillStyle = '#90a4ae';
  ctx.fillRect(gx + 5, gy, 2, gh);

  ctx.fillStyle = '#ffd54f';
  ctx.beginPath();
  ctx.arc(gx + 3.5, gy - 4, 8, 0, Math.PI*2);
  ctx.fill();

  const wave = Math.sin(time * 4) * 6;
  ctx.fillStyle = '#e74c3c';
  ctx.beginPath();
  ctx.moveTo(gx + 7, gy + 6);
  ctx.quadraticCurveTo(gx + 46, gy + 16 + wave, gx + 72, gy + 34);
  ctx.quadraticCurveTo(gx + 46, gy + 52 - wave, gx + 7, gy + 62);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.beginPath();
  ctx.moveTo(gx + 7, gy + 12);
  ctx.quadraticCurveTo(gx + 34, gy + 24 + wave, gx + 46, gy + 34);
  ctx.quadraticCurveTo(gx + 30, gy + 42 - wave, gx + 7, gy + 50);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = '#8d6e63';
  roundRect(gx - 16, GROUND_Y - 14, 40, 14, 5);
  ctx.fill();
}

function drawPlayer() {
  const { x, y, w, h } = player;

  // ⚡ 蓄力條：按住捕捉鍵時在頭頂顯示（滿 2 秒放出一隻）
  if (player.chargeT > 0 && (player.holding.length || player.holdingHydra || player.ridingOn || player.mount)) {
    const pct = Math.min(1, player.chargeT / 1);
    const bw = 56, bx0 = x + w/2 - bw/2, by0 = y - 22;
    ctx.save();
    ctx.fillStyle = 'rgba(10,20,30,0.65)';
    roundRect(bx0 - 2, by0 - 2, bw + 4, 10, 5);
    ctx.fill();
    const grad = ctx.createLinearGradient(bx0, 0, bx0 + bw, 0);
    grad.addColorStop(0, '#7dd87d');
    grad.addColorStop(0.7, '#ffd54a');
    grad.addColorStop(1, '#ff7b2d');
    ctx.fillStyle = grad;
    roundRect(bx0, by0, bw * pct, 6, 3);
    ctx.fill();
    ctx.restore();
  }

  ctx.save();

  if (player.hurtTimer > 0 && Math.floor(player.hurtTimer * 12) % 2 === 0) {
    ctx.globalAlpha = 0.35;
  }

  ctx.translate(x + w/2, y + h);

  /* 💔 戰敗：慢慢向後倒下躺下 */
  if (state === 'defeat') {
    const fp = Math.min(1, (time - defeatT0) / 0.55);
    const ease = 1 - (1 - fp) * (1 - fp);
    ctx.rotate(-Math.PI / 2 * ease * player.facing);
    ctx.translate(0, 4 * ease);
  }

  /* ⭐ 空中翻滾：以角色中心為軸旋轉 */
  if (player.spinT > 0) {
    const p = 1 - player.spinT / 0.42;      // 0 → 1
    ctx.translate(0, -h/2);
    ctx.rotate(p * Math.PI * 2 * player.facing);
    ctx.translate(0, h/2);
  }

  ctx.scale(player.facing, 1);

  const walk = player.onGround && Math.abs(player.vx) > 20;
  const legSwing = walk ? Math.sin(player.animT * 3.2) * 5 : 0;
  const bob = walk ? Math.abs(Math.sin(player.animT * 3.2)) * 1.6 : 0;

  ctx.fillStyle = 'rgba(0,0,0,0.15)';
  ctx.beginPath();
  ctx.ellipse(0, 0, 15, 4, 0, 0, Math.PI*2);
  ctx.fill();

  ctx.translate(0, -bob);

  const pim = IMGS.player;
  const dh0 = 60;
  const meta = PARTS.player;
  const dw0 = dh0 * (meta ? meta.w / meta.h : (pim ? pim.width / pim.height : 0.6));
  const air = player.onGround ? 0 : 1;

  // 🧣 披肩（畫在身體後方，隨速度與跳躍飄動）
  const capeCol = (typeof COSTUMES !== 'undefined' && COSTUMES[player.costume]) ? COSTUMES[player.costume].cape : null;
  drawCapeFlow(dw0, dh0, player.vx, player.vy, air,
    capeCol ? capeCol[0] : undefined, capeCol ? capeCol[1] : undefined, capeCol ? capeCol[2] : undefined);

  // 👧 小紅帽木偶：頭/雙腿隨跑動跳躍擺動，身體前傾＋空中伸展
  const okP = drawPuppet('player', 0, 0, dw0, 1, {
    phase: player.animT * 3.2,
    move: walk ? Math.min(Math.abs(player.vx) / 260, 1) : 0,
    air: air,
    flap: 0,
    lean: clamp(player.vx / 420, -1, 1) * 0.07,
    squash: player.landT || 0,
    idlePh: 0
  });

  // 😭 戰敗哭泣：緊閉雙眼＋大哭嘴＋眼淚不斷滴落
  if (state === 'defeat' && okP && meta) {
    const hd = meta.parts.find(q => q.key === 'player_head');
    if (hd) {
      const hsx = dw0 / meta.w, hsy = dh0 / meta.h;
      const hx = hd.px * hsx - dw0 / 2 + hd.w * hsx * 0.18;
      const hy = hd.py * hsy - dh0 + hd.h * hsy * 0.42;
      ctx.strokeStyle = '#4a2020';
      ctx.lineWidth = 1.8;
      ctx.lineCap = 'round';
      const ex = hd.w * hsx * 0.16;
      for (const sgn of [-1, 1]) {              // 緊閉下彎的哭哭眼
        const cx0 = hx + sgn * ex;
        ctx.beginPath();
        ctx.moveTo(cx0 - 3.2, hy + 1);
        ctx.quadraticCurveTo(cx0, hy - 3.4, cx0 + 3.2, hy + 1);
        ctx.stroke();
      }
      ctx.fillStyle = '#5e2020';                // 大哭張開的嘴
      ctx.beginPath();
      ctx.ellipse(hx, hy + 8, 3.6, 4.6, 0, 0, Math.PI * 2);
      ctx.fill();
      // 💧 眼淚（躺下時 -x 方向即世界的下方）
      ctx.fillStyle = 'rgba(140,200,255,0.95)';
      for (let i = 0; i < 3; i++) {
        const tt = ((time * 34 + i * 15) % 40);
        ctx.globalAlpha = Math.max(0, 1 - tt / 40);
        ctx.beginPath();
        ctx.ellipse(hx - ex - tt * 0.8, hy + 2 + tt * 0.4, 2.2, 3.2, 0, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
  }

  // 😣 受傷痛苦表情：緊閉雙眼＋波浪嘴＋汗珠
  if (player.hurtTimer > 0 && okP && meta) {
    const hd = meta.parts.find(q => q.key === 'player_head');
    if (hd) {
      const hsx = dw0 / meta.w, hsy = dh0 / meta.h;
      const hx = hd.px * hsx - dw0 / 2 + hd.w * hsx * 0.18;
      const hy = hd.py * hsy - dh0 + hd.h * hsy * 0.42;
      ctx.strokeStyle = '#5a1a1a';
      ctx.lineWidth = 1.8;
      ctx.lineCap = 'round';
      const ex = hd.w * hsx * 0.16;                 // 雙眼間距
      for (const sgn of [-1, 1]) {                  // >_< 緊閉雙眼
        const cx0 = hx + sgn * ex;
        ctx.beginPath();
        ctx.moveTo(cx0 - 3, hy - 3); ctx.lineTo(cx0 + 3, hy + 2);
        ctx.moveTo(cx0 + 3, hy - 3); ctx.lineTo(cx0 - 3, hy + 2);
        ctx.stroke();
      }
      ctx.beginPath();                              // 波浪痛苦嘴
      const my = hy + 8;
      ctx.moveTo(hx - 6, my);
      for (let i = 0; i < 4; i++) {
        ctx.quadraticCurveTo(hx - 6 + i * 3 + 1.5, my + (i % 2 === 0 ? 3 : -1), hx - 6 + (i + 1) * 3, my);
      }
      ctx.stroke();
      const swPh = (time * 2.2) % 1;                // 汗珠滑落
      ctx.fillStyle = 'rgba(140,200,255,' + (1 - swPh) * 0.95 + ')';
      ctx.beginPath();
      ctx.ellipse(hx + ex + 7, hy - 8 + swPh * 12, 2.4, 3.4, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // 👗 服裝帽飾與精緻細節：唐裝瓜皮帽＋盤扣 / 公主皇冠＋寶石 / 牛仔帽＋皮帶扣
  if (okP && meta && player.costume && player.costume !== 'red') {
    const hd = meta.parts.find(q => q.key === 'player_head');
    if (hd) {
      const hsx = dw0 / meta.w, hsy = dh0 / meta.h;
      const hw = hd.w * hsx;
      const hcx = hd.x * hsx - dw0 / 2 + hw * 0.62;       // 頭部中心（偏向面部一側）
      const hty = hd.y * hsy - dh0;                       // 頭頂（部件上緣）
      ctx.save();
      if (player.costume === 'tang') {
        // 🏮 瓜皮帽：黑緞半圓＋金邊＋紅帽珠
        ctx.fillStyle = '#2a2a33';
        ctx.beginPath(); ctx.ellipse(hcx, hty + 3, hw * 0.46, hw * 0.30, 0, Math.PI, 0, true); ctx.fill();
        ctx.strokeStyle = '#d4a017'; ctx.lineWidth = 1.6;
        ctx.beginPath(); ctx.ellipse(hcx, hty + 3, hw * 0.46, hw * 0.30, 0, Math.PI, 0, true); ctx.stroke();
        ctx.fillStyle = '#c22727';
        ctx.beginPath(); ctx.arc(hcx, hty + 3 - hw * 0.28, 3, 0, Math.PI * 2); ctx.fill();
        // 🏮 唐裝胸前金色盤扣
        ctx.fillStyle = '#ffd54a';
        ctx.strokeStyle = '#8a5a10';
        ctx.lineWidth = 1;
        for (let i = 0; i < 3; i++) {
          const by = -dh0 * 0.50 + i * 6.5;
          ctx.beginPath(); ctx.arc(dw0 * 0.04, by, 1.8, 0, Math.PI * 2); ctx.fill();
          ctx.beginPath(); ctx.moveTo(dw0 * 0.04 - 3.5, by); ctx.lineTo(dw0 * 0.04 + 3.5, by); ctx.stroke();
        }
      } else if (player.costume === 'princess') {
        // 👑 金皇冠＋紅寶石
        const cw = hw * 0.55, cy0 = hty + 5;
        ctx.fillStyle = '#f5c542';
        ctx.beginPath();
        ctx.moveTo(hcx - cw / 2, cy0);
        ctx.lineTo(hcx - cw / 2, cy0 - 8);
        ctx.lineTo(hcx - cw / 6, cy0 - 3);
        ctx.lineTo(hcx, cy0 - 11);
        ctx.lineTo(hcx + cw / 6, cy0 - 3);
        ctx.lineTo(hcx + cw / 2, cy0 - 8);
        ctx.lineTo(hcx + cw / 2, cy0);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#e03030';
        ctx.beginPath(); ctx.arc(hcx, cy0 - 5.5, 1.8, 0, Math.PI * 2); ctx.fill();
        // 👑 公主胸前閃亮藍寶石與珍珠領邊
        ctx.fillStyle = '#5ac8fa';
        ctx.beginPath(); ctx.arc(dw0 * 0.03, -dh0 * 0.48, 2.2, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#ffd54a'; ctx.lineWidth = 1; ctx.stroke();
      } else if (player.costume === 'cowboy') {
        // 🤠 牛仔帽：寬帽檐＋圓頂＋帽帶
        ctx.fillStyle = '#7a4a1e';
        ctx.beginPath(); ctx.ellipse(hcx, hty + 5, hw * 0.62, 3.4, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#8a5a2a';
        ctx.beginPath(); ctx.ellipse(hcx, hty + 3, hw * 0.34, hw * 0.26, 0, Math.PI, 0, true); ctx.fill();
        ctx.strokeStyle = '#5e3a14'; ctx.lineWidth = 1.4;
        ctx.beginPath(); ctx.moveTo(hcx - hw * 0.34, hty + 4); ctx.lineTo(hcx + hw * 0.34, hty + 4); ctx.stroke();
        // 🤠 西部牛仔金星皮帶扣
        ctx.fillStyle = '#ffd54a';
        ctx.beginPath(); ctx.arc(dw0 * 0.02, -dh0 * 0.34, 2.2, 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();
    }
  }

  /* 🥅 手持捕捉網：平時垂放身側，攻擊時向前猛揮＋弧光 */
  {
    const sw = player.atkT > 0 ? (0.26 - player.atkT) / 0.26 : 0;   // 揮擊進度 0→1
    const ang = player.atkT > 0
      ? -2.0 + Math.min(sw * 1.4, 1) * 3.1                          // 由後上方掃向前下方
      : 0.55 + Math.sin(time * 2.2) * 0.05;                         // 平時輕輕搖晃
    const hx = dw0 * 0.16, hy = -dh0 * 0.46;                        // 手部位置
    ctx.save();
    ctx.translate(hx, hy);
    ctx.rotate(ang);
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#8a5a2a'; ctx.lineWidth = 3;                 // 木柄
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(25, 0); ctx.stroke();
    ctx.strokeStyle = '#c9d6e2'; ctx.lineWidth = 2.5;               // 網圈
    ctx.beginPath(); ctx.ellipse(35, 0, 11, 8.5, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,0.75)'; ctx.lineWidth = 1;  // 網格
    for (let i = -2; i <= 2; i++) {
      ctx.beginPath(); ctx.moveTo(35 + i * 4.2, -6.6); ctx.lineTo(35 + i * 4.2, 6.6); ctx.stroke();
    }
    ctx.beginPath(); ctx.moveTo(26, 0); ctx.lineTo(44, 0); ctx.stroke();
    // 🥅 網中抓到的小妖（藍色伙伴，迷你顯示）
    if (player.holding.length) {
      ctx.save();
      ctx.rotate(-ang);        // 保持小妖直立
      ctx.translate(35, -4);
      drawCritter(player.holding[player.holding.length - 1], 0, 6, 15, { anim: time * 3, dir: 1, blue: true });
      ctx.restore();
    }
    ctx.restore();
    if (player.atkT > 0) {                                          // 揮擊弧光
      ctx.save();
      ctx.globalAlpha = 0.75 * (1 - sw * 0.7);
      ctx.strokeStyle = '#aef1ff';
      ctx.lineWidth = 5;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.arc(hx + 4, hy + 2, 42, -1.2, -1.2 + sw * 2.7);
      ctx.stroke();
      ctx.restore();
    }
  }

  if (!okP && pim) {
    // 備用：整圖繪製
    const dh = dh0;
    const dw = dh * (pim.width / pim.height);
    const tilt = walk ? Math.sin(player.animT * 3.2) * 0.05 : 0;
    ctx.rotate(tilt);
    ctx.drawImage(pim, -dw/2, -dh, dw, dh);
    ctx.restore();
    drawJumpDots();
    return;
  }
  if (okP) {
    ctx.restore();
    drawJumpDots();
    return;
  }

  ctx.fillStyle = '#2d4a8a';
  roundRect(-9 + legSwing, -13, 8, 13, 3); ctx.fill();
  roundRect( 1 - legSwing, -13, 8, 13, 3); ctx.fill();

  ctx.fillStyle = '#5c3a1e';
  roundRect(-10 + legSwing, -6, 10, 6, 3); ctx.fill();
  roundRect( 0 - legSwing, -6, 10, 6, 3); ctx.fill();

  ctx.fillStyle = '#d63a2f';
  roundRect(-11, -30, 22, 20, 7); ctx.fill();

  ctx.fillStyle = '#f5c542';
  ctx.fillRect(-11, -18, 22, 4);

  ctx.fillStyle = '#d63a2f';
  const armSwing = walk ? -legSwing * 0.9 : 0;
  roundRect(-15, -28 + armSwing * 0.3, 6, 13, 3); ctx.fill();
  roundRect(  9, -28 - armSwing * 0.3, 6, 13, 3); ctx.fill();

  ctx.fillStyle = '#f7c9a3';
  ctx.beginPath();
  ctx.arc(-12, -15 + armSwing * 0.3, 3.4, 0, Math.PI*2);
  ctx.arc( 12, -15 - armSwing * 0.3, 3.4, 0, Math.PI*2);
  ctx.fill();

  ctx.fillStyle = '#f7c9a3';
  ctx.beginPath();
  ctx.arc(1, -38, 9.5, 0, Math.PI*2);
  ctx.fill();

  ctx.fillStyle = '#5a3418';
  ctx.beginPath();
  ctx.arc(-5, -38, 8, 0, Math.PI*2);
  ctx.fill();

  ctx.fillStyle = '#c0392b';
  ctx.beginPath();
  ctx.arc(1, -41, 10.5, Math.PI, 0);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(1, -41, 12, 3.5, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-9, -43);
  ctx.quadraticCurveTo(-16, -50, -10, -52);
  ctx.quadraticCurveTo(-6, -50, -4, -44);
  ctx.fill();

  ctx.fillStyle = '#222';
  ctx.beginPath();
  ctx.arc(5, -39, 1.9, 0, Math.PI*2);
  ctx.arc(-1, -39, 1.9, 0, Math.PI*2);
  ctx.fill();

  ctx.fillStyle = 'rgba(240,120,120,0.5)';
  ctx.beginPath();
  ctx.arc(8, -34, 3, 0, Math.PI*2);
  ctx.arc(-4, -34, 2.4, 0, Math.PI*2);
  ctx.fill();

  ctx.strokeStyle = '#8b3a3a';
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.arc(2, -34.5, 3, 0.2, Math.PI - 0.2);
  ctx.stroke();

  ctx.restore();

  drawJumpDots();
}

/* ⭐ 跳躍次數指示點（浮在頭頂） */
function drawJumpDots() {
  if (state === 'playing') {
    const n = player.maxJumps;
    for (let i = 0; i < n; i++) {
      const lit = i < player.jumpsLeft;
      const dx = (i - (n - 1) / 2) * 13;
      const px = player.x + player.w / 2 + dx;
      const py = player.y - 10 + Math.sin(time * 5 + i) * 1.4;

      ctx.beginPath();
      ctx.arc(px, py, 3.6, 0, Math.PI * 2);
      if (lit) {
        ctx.shadowColor = '#7df9ff';
        ctx.shadowBlur = 9;
        ctx.fillStyle = '#7df9ff';
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.strokeStyle = 'rgba(255,255,255,0.95)';
        ctx.lineWidth = 1.2;
        ctx.stroke();
      } else {
        ctx.fillStyle = 'rgba(125,249,255,0.15)';
        ctx.fill();
        ctx.strokeStyle = 'rgba(125,249,255,0.4)';
        ctx.lineWidth = 1;
        ctx.stroke();
      }
    }
  }
}

function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawRings() {
  for (const r of rings) {
    const a = Math.max(0, r.life / r.maxLife);
    ctx.globalAlpha = a * 0.85;
    ctx.strokeStyle = r.color;
    ctx.lineWidth = 4 * a + 1;
    ctx.shadowColor = r.color;
    ctx.shadowBlur = 16;
    ctx.beginPath();
    ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2);
    ctx.stroke();
    ctx.shadowBlur = 0;
  }
  ctx.globalAlpha = 1;
}

/* ---------- 螢幕空間 UI ---------- */
function drawJoystick() {
  let bx, by;
  if (joy.active) { bx = joy.baseX; by = joy.baseY; }
  else            { bx = 96;        by = H - 100; }

  ctx.globalAlpha = joy.active ? 0.45 : 0.22;
  ctx.beginPath();
  ctx.arc(bx, by, JOY_R, 0, Math.PI*2);
  ctx.fillStyle = '#ffffff';
  ctx.fill();
  ctx.lineWidth = 3;
  ctx.strokeStyle = '#1c2b3a';
  ctx.globalAlpha = joy.active ? 0.8 : 0.4;
  ctx.stroke();

  ctx.globalAlpha = joy.active ? 0.55 : 0.3;
  ctx.fillStyle = '#1c2b3a';
  ctx.beginPath();
  ctx.moveTo(bx - JOY_R + 14, by); ctx.lineTo(bx - JOY_R + 24, by - 9);
  ctx.lineTo(bx - JOY_R + 24, by + 9); ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(bx + JOY_R - 14, by); ctx.lineTo(bx + JOY_R - 24, by - 9);
  ctx.lineTo(bx + JOY_R - 24, by + 9); ctx.closePath(); ctx.fill();

  const kx = bx + joy.dx;
  const ky = by + joy.dy;
  ctx.globalAlpha = joy.active ? 1 : 0.45;
  const g = ctx.createRadialGradient(kx - 8, ky - 8, 3, kx, ky, JOY_R * 0.5);
  g.addColorStop(0, '#8fd0ff');
  g.addColorStop(1, '#2f6fb5');
  ctx.beginPath();
  ctx.arc(kx, ky, JOY_R * 0.44, 0, Math.PI*2);
  ctx.fillStyle = g;
  ctx.fill();
  ctx.lineWidth = 3;
  ctx.strokeStyle = 'rgba(255,255,255,0.85)';
  ctx.stroke();

  ctx.globalAlpha = 1;
}

function drawJumpButton() {
  const bx = W - 88, by = H - 96;
  const R = 48;

  const canDouble = !player.onGround && player.jumpsLeft > 0 && state === 'playing';
  const noJump    = player.jumpsLeft <= 0 && state === 'playing';

  ctx.globalAlpha = jmp.active ? 0.95 : 0.42;
  const g = ctx.createRadialGradient(bx, by - 12, 6, bx, by, R);
  if (canDouble) {                                   // ⭐ 可二段跳時泛藍光
    g.addColorStop(0, jmp.active ? '#a8f0ff' : '#7df9ff');
    g.addColorStop(1, jmp.active ? '#22a7e0' : '#1c6fa8');
  } else if (noJump) {
    g.addColorStop(0, '#9aa7b5');
    g.addColorStop(1, '#5b6875');
  } else {
    g.addColorStop(0, jmp.active ? '#ffd166' : '#ffffff');
    g.addColorStop(1, jmp.active ? '#f4a300' : '#dfe6ee');
  }
  ctx.beginPath();
  ctx.arc(bx, by, R, 0, Math.PI*2);
  ctx.fillStyle = g;
  ctx.fill();
  ctx.lineWidth = 3.5;
  ctx.strokeStyle = canDouble ? '#7df9ff'
                  : jmp.active ? '#ffffff'
                  : 'rgba(30,50,70,0.45)';
  ctx.stroke();

  ctx.globalAlpha = 1;
  ctx.fillStyle = jmp.active ? '#ffffff' : (canDouble ? '#083344' : '#2c3e50');
  ctx.beginPath();
  ctx.moveTo(bx,      by - 20);
  ctx.lineTo(bx + 17, by + 3);
  ctx.lineTo(bx + 7,  by + 3);
  ctx.lineTo(bx + 7,  by + 19);
  ctx.lineTo(bx - 7,  by + 19);
  ctx.lineTo(bx - 7,  by + 3);
  ctx.lineTo(bx - 17, by + 3);
  ctx.closePath();
  ctx.fill();

  ctx.font = 'bold 12px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = jmp.active ? '#ffffff' : (canDouble ? '#083344' : '#3a4a5a');
  ctx.globalAlpha = 0.9;
  ctx.fillText('JUMP', bx, by + 32);
  ctx.globalAlpha = 1;

  /* ⭐ 按鈕上的次數徽章 */
  if (state === 'playing') {
    const badgeX = bx + R * 0.72;
    const badgeY = by - R * 0.72;
    const lit = player.jumpsLeft > 0;
    ctx.beginPath();
    ctx.arc(badgeX, badgeY, 12, 0, Math.PI * 2);
    ctx.fillStyle = lit ? '#7df9ff' : 'rgba(120,140,160,0.75)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.9)';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.fillStyle = lit ? '#062a3a' : '#e8eef4';
    ctx.font = 'bold 13px system-ui, sans-serif';
    ctx.fillText(String(player.jumpsLeft), badgeX, badgeY + 1);
  }
}

/* 🥅 攻擊按鈕（跳躍鍵左邊） */
function drawAttackButton() {
  const bx = W - 196, by = H - 96, R = 40;
  const ready = player.atkCD <= 0 && state === 'playing';

  ctx.globalAlpha = atk.active ? 0.95 : 0.42;
  const g = ctx.createRadialGradient(bx, by - 10, 5, bx, by, R);
  if (ready) {
    g.addColorStop(0, atk.active ? '#d8ffe4' : '#b8f4c8');
    g.addColorStop(1, atk.active ? '#2e9e5b' : '#23804a');
  } else {
    g.addColorStop(0, '#c9ced6');
    g.addColorStop(1, '#6a727e');
  }
  ctx.beginPath();
  ctx.arc(bx, by, R, 0, Math.PI*2);
  ctx.fillStyle = g;
  ctx.fill();
  ctx.lineWidth = 3.5;
  ctx.strokeStyle = atk.active ? '#ffffff' : 'rgba(30,50,70,0.45)';
  ctx.stroke();

  // 捕捉網圖示
  ctx.globalAlpha = 1;
  ctx.save();
  ctx.translate(bx, by - 4);
  ctx.rotate(-0.5);
  ctx.lineCap = 'round';
  ctx.strokeStyle = ready ? '#06301a' : '#3a4148';
  ctx.lineWidth = 3.5;
  ctx.beginPath(); ctx.moveTo(-13, 10); ctx.lineTo(2, -2); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(9, -7, 10, 7.5, 0.35, 0, Math.PI*2); ctx.stroke();
  ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.moveTo(3, -12); ctx.lineTo(15, -2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(15, -12); ctx.lineTo(3, -2); ctx.stroke();
  ctx.restore();

  ctx.font = 'bold 12px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = atk.active ? '#ffffff' : (ready ? '#0b3a20' : '#4a545e');
  ctx.globalAlpha = 0.9;
  ctx.fillText(player.holdingHydra ? '扔龍' : (player.holding.length ? '放出' : '捕捉'), bx, by + 26);
  ctx.globalAlpha = 1;

  // 🥅 持有徽章：按鈕右上角顯示網中藍色小妖＋數量
  if (player.holding.length) {
    ctx.beginPath();
    ctx.arc(bx + R * 0.75, by - R * 0.75, 13, 0, Math.PI * 2);
    ctx.fillStyle = '#3f9be0';
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.9)';
    ctx.lineWidth = 2;
    ctx.stroke();
    drawCritter(player.holding[player.holding.length - 1], bx + R * 0.75, by - R * 0.75 + 6, 14,
      { anim: time * 3, dir: 1, blue: true });
    if (player.holding.length > 1) {
      ctx.beginPath();
      ctx.arc(bx + R * 0.75 + 12, by - R * 0.75 - 10, 9, 0, Math.PI * 2);
      ctx.fillStyle = '#c0392b';
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 11px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('×' + player.holding.length, bx + R * 0.75 + 12, by - R * 0.75 - 10);
    }
  }
}

  ctx.fill();
  ctx.fillStyle = '#FFE894';

  ctx.fillStyle = '#0b1b2b';

  ctx.font = 'bold 18px system-ui, -apple-system, sans-serif';
  ctx.globalAlpha = 0.4;
  ctx.fillStyle = '#0b1b2b';
  roundRect(W - 150, 14, 136, 36, 12);
  ctx.fill();
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#ffffff';

}

function drawOverlay() {
  if (state === 'playing' || state === 'quiz' || state === 'ready' || state === 'jerusalem') return;

  ctx.fillStyle = 'rgba(6, 18, 32, 0.62)';
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  let title = '', sub = '', tip = '', lines = [];

  if (state === 'stageclear') {
    const st = allStats[allStats.length - 1];
    const rate = st.asked ? Math.round(st.correct / st.asked * 100) : 0;
    title = `🚩 第 ${st.stage} 關「${st.cfg.name}」通過！`;
    sub   = `${st.cfg.emoji} ${st.cfg.beastName}（${st.cfg.subject}）答題結果`;
    lines = [
      `出題 ${st.asked} 題　✅ 答對 ${st.correct}　❌ 答錯 ${st.wrong}`,
      `正確率 ${rate}%`,
      `目前總分：${score}`
    ];
    tip   = `點擊畫面進入第 ${stage + 1} 關「${STAGES[stage].name}」${STAGES[stage].emoji}`;
  } else if (state === 'gameover') {
    if (failReason === 'nokey') {
      title = '🔑 過關失敗';
      sub   = `鑰匙不足（${keyCount}/${KEYS_NEED}）！擊敗魔物答對題目才能取得鑰匙`;
    } else {
      title = 'GAME OVER';
      sub   = `💔 小紅帽的心用完了……　第 ${stage} 關　最終分數：${score}　金幣：${coinCount}　鑰匙：${keyCount}/${KEYS_NEED}`;
    }
    tip   = '點擊畫面回到主選單';
  } else if (state === 'win') {
    title = cross && cross.got ? '✝️ 新天新地降臨！五關全破！' : '🎉 五關全部通過！';
    sub   = `總分：${score}　金幣：${coinCount}` + (cross && cross.got ? '　✝️ 十字架寶藏已取得' : '');
    lines = allStats.map(st => {
      const rate = st.asked ? Math.round(st.correct / st.asked * 100) : 0;
      return `${st.cfg.emoji} ${st.cfg.name}（${st.cfg.subject}）：${st.asked} 題中答對 ${st.correct}，正確率 ${rate}%`;
    });
    tip   = '點擊畫面回到主選單';
  }

  const cy = H * 0.32;

  if (state === 'gameover' && failReason !== 'nokey') {
    // 街機風 GAME OVER：紅色大字＋黑色描邊＋脈動光暈
    const pulse = 1 + Math.sin(time * 3) * 0.03;
    ctx.save();
    ctx.translate(W/2, cy);
    ctx.scale(pulse, pulse);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const fs = Math.min(64, W * 0.13);
    ctx.font = `900 ${fs}px "Arial Black", system-ui, sans-serif`;
    ctx.shadowColor = 'rgba(255,60,60,0.8)';
    ctx.shadowBlur = 26;
    ctx.lineWidth = fs * 0.14;
    ctx.strokeStyle = '#3a0000';
    ctx.strokeText('GAME OVER', 0, 0);
    const grad = ctx.createLinearGradient(0, -fs/2, 0, fs/2);
    grad.addColorStop(0, '#ff8a80');
    grad.addColorStop(0.5, '#ff1744');
    grad.addColorStop(1, '#b71c1c');
    ctx.fillStyle = grad;
    ctx.fillText('GAME OVER', 0, 0);
    ctx.restore();
  } else {
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.6)';
    ctx.shadowBlur = 18;
    ctx.font = `bold ${Math.min(46, W * 0.09)}px system-ui, -apple-system, sans-serif`;
    ctx.fillStyle = '#ffd166';
    ctx.fillText(title, W/2, cy);
    ctx.restore();
  }

  ctx.font = `500 ${Math.min(18, W * 0.042)}px system-ui, -apple-system, sans-serif`;
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.fillText(sub, W/2, cy + Math.min(52, W * 0.11));

  // 各關答題統計行
  if (lines.length) {
    ctx.font = `500 ${Math.min(15, W * 0.036)}px system-ui, -apple-system, sans-serif`;
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    lines.forEach((ln, i) => {
      ctx.fillText(ln, W/2, cy + Math.min(88, W * 0.19) + i * Math.min(26, W * 0.06));
    });
  }

  const blink = 0.55 + Math.sin(time * 4) * 0.45;
  ctx.globalAlpha = blink;
  ctx.font = `bold ${Math.min(22, W * 0.052)}px system-ui, -apple-system, sans-serif`;
  ctx.fillStyle = '#ffffff';
  ctx.fillText(tip, W/2, H * 0.78);
  ctx.globalAlpha = 1;
}

/* ---------- 三層卷軸視差背景 ---------- */
function drawParallax(img, factor, targetH, bottomScreenY, mirror) {
  if (!img) return false;
  const dw = img.width / img.height * targetH;
  let off = -(cam.x * scale * factor) % dw;
  if (off > 0) off -= dw;
  const dy = bottomScreenY - targetH;
  let i = Math.floor((cam.x * scale * factor) / dw);
  for (let x = off; x < W; x += dw, i++) {
    if (mirror && (i % 2)) {
      ctx.save();
      ctx.translate(x + dw / 2, 0);
      ctx.scale(-1, 1);
      ctx.drawImage(img, -dw / 2, dy, dw, targetH);
      ctx.restore();
    } else {
      ctx.drawImage(img, x, dy, dw, targetH);
    }
  }
  return true;
}

/* ====================== 主繪製 ====================== */
function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';   // 高解像小怪縮放保持細節

  const th = TH();
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0,    th.sky[0]);
  sky.addColorStop(0.45, th.sky[1]);
  sky.addColorStop(1,    th.sky[2]);
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  // 遠景：整幅細緻風景（視差 0.12），地面線對齊實際地面
  const groundSY = (GROUND_Y - cam.y) * scale;
  const farImg = IMGS[th.bg + '_far'];
  const hasFar = farImg
    ? drawParallax(farImg, 0.12, Math.max(H * 1.02, groundSY + H * 0.30), groundSY + H * 0.30, false)
    : false;
  if (!hasFar) drawClouds();

  // 中景（視差 0.45）與近景（視差 0.78）：鏡像平鋪減少接縫
  const midImg  = IMGS[th.bg + '_mid'];
  const nearImg = IMGS[th.bg + '_near'];
  if (midImg)  drawParallax(midImg,  0.45, Math.max(H * 0.58, groundSY * 0.72), groundSY + 8 * scale, true);
  if (nearImg) drawParallax(nearImg, 0.78, H * 0.34, groundSY + 26 * scale, true);

  ctx.save();
  ctx.scale(scale, scale);
  ctx.translate(-cam.x, -cam.y);

  const viewW = W / scale;
  const viewH = H / scale;
  const vx0 = cam.x - 120, vx1 = cam.x + viewW + 120;

  if (!farImg) drawBackgroundWorld();   // 圖片未載入時的舊版備用背景

  for (const p of platforms) {
    if (p.x + p.w < vx0 || p.x > vx1) continue;
    drawPlatform(p);
  }

  if (goal && goal.x > vx0 - 200 && goal.x < vx1 + 200) drawGoal();
  drawFireLake();
  drawHydra();

  for (const c of coins) {
    if (c.got) continue;
    if (c.x < vx0 || c.x > vx1) continue;
    drawCoin(c);
  }

  for (const e of enemies) {
    if (e.dead && e.deadT > 0.45) continue;
    if (e.x + e.w < vx0 || e.x > vx1) continue;
    drawEnemy(e);
  }

  for (const b of beasts) {
    if (b.defeated) continue;
    if (b.x + b.w < vx0 || b.x > vx1) continue;
    drawBeast(b);
  }
  drawSouls();
  drawKeyItems();

  drawProjs();
  drawShots();
  drawThrown();
  drawSnakeShots();
  drawPartners();

  drawParticles();
  drawRings();

  if (cross && cross.x + cross.w > vx0 && cross.x < vx1) drawCross();

  if (state === 'playing' || state === 'ready' || state === 'quiz' || state === 'defeat') drawPlayer();

  ctx.restore();

  drawJerusalem();   // ✝️ 新天新地動畫（螢幕座標）

  if (state === 'playing') {
    drawHUD();
    drawJoystick();
    drawJumpButton();
    drawAttackButton();
  }

  // 👗 過關/全破結算時顯示換裝按鈕
  wardBtn.style.display = (state === 'stageclear' || state === 'win') ? 'block' : 'none';
  drawOverlay();
}

/* ====================== 主迴圈 ====================== */
let lastT = performance.now();
let acc = 0;
const STEP = 1 / 60;

function loop(t) {
  requestAnimationFrame(loop);

  let dt = (t - lastT) / 1000;
  lastT = t;
  if (dt > 0.25) dt = 0.25;

  acc += dt;
  let guard = 0;
  while (acc >= STEP && guard < 5) {
    update(STEP);
    acc -= STEP;
    guard++;
  }
  if (guard >= 5) acc = 0;

  render();
}

/* ====================== 👧 選單小紅帽：萌萌走來走去 ====================== */
const menuCv = document.getElementById('menuCanvas');
const mctx = menuCv.getContext('2d');
let menuT = 0;

function drawMiniPlayer(x, yB, dh, dir, ph) {
  mctx.save();
  mctx.translate(x, yB);
  mctx.fillStyle = 'rgba(60,40,10,0.20)';
  mctx.beginPath();
  mctx.ellipse(0, 2, dh * 0.30, dh * 0.065, 0, 0, Math.PI * 2);
  mctx.fill();

  const meta = PARTS.player;
  const cost = (typeof player !== 'undefined' && player && player.costume) ? player.costume : (typeof wardrobe !== 'undefined' && wardrobe.eq ? wardrobe.eq : 'red');
  const base = (cost && cost !== 'red' && IMGS['player_' + cost + '_pbase']) ? IMGS['player_' + cost + '_pbase'] : (meta ? IMGS.player_pbase : null);
  if (!meta || !base) { mctx.restore(); return; }   // 部件未載入完成前先不畫（避免出現圓點替身）

  const dw = dh * (meta.w / meta.h);
  const sx = dw / meta.w, sy = dh / meta.h;
  mctx.scale(dir, 1);
  mctx.translate(0, -Math.abs(Math.sin(ph)) * dh * 0.035);   // 步行彈跳
  mctx.rotate(Math.sin(ph) * 0.028);

  // 小披肩（隨步行波浪擺動，按套裝配色）
  const wob = Math.sin(menuT * 6) * dh * 0.035;
  const capeCol = (typeof COSTUMES !== 'undefined' && COSTUMES[cost]) ? COSTUMES[cost].cape : null;
  mctx.fillStyle = capeCol ? capeCol[0] : '#c22727';
  mctx.beginPath();
  mctx.moveTo(-dw * 0.05, -dh * 0.74);
  mctx.quadraticCurveTo(-dw * 0.44 - wob, -dh * 0.48, -dw * 0.34 - wob * 1.5, -dh * 0.14);
  mctx.quadraticCurveTo(-dw * 0.20, -dh * 0.30, -dw * 0.02, -dh * 0.38);
  mctx.closePath();
  mctx.fill();

  const drawP = (key, ang) => {
    const p = meta.parts.find(q => q.key === key);
    const imKey = (cost && cost !== 'red' && IMGS['p_player_' + cost + '_' + key.replace('player_', '')])
      ? 'p_player_' + cost + '_' + key.replace('player_', '')
      : 'p_' + key;
    const im = IMGS[imKey] || IMGS['p_' + key];
    if (!p || !im) return;
    const px = p.px * sx - dw / 2, py = p.py * sy - dh;
    mctx.save();
    mctx.translate(px, py);
    mctx.rotate(ang);
    mctx.drawImage(im, p.x * sx - dw / 2 - px, p.y * sy - dh - py, p.w * sx, p.h * sy);
    mctx.restore();
  };

  drawP('player_legL', Math.sin(ph) * 0.5);                    // 後腿
  mctx.drawImage(base, -dw / 2, -dh, dw, dh);                  // 身體
  drawP('player_legR', Math.sin(ph + Math.PI) * 0.5);          // 前腿
  drawP('player_head', Math.sin(ph * 0.5) * 0.06 + Math.sin(menuT * 3) * 0.04);  // 萌萌點頭

  // 迷你版小帽飾 / 皇冠 / 盤扣
  if (cost && cost !== 'red') {
    const hd = meta.parts.find(q => q.key === 'player_head');
    if (hd) {
      const hw = hd.w * sx;
      const hcx = hd.x * sx - dw / 2 + hw * 0.62;
      const hty = hd.y * sy - dh;
      mctx.save();
      if (cost === 'tang') {
        mctx.fillStyle = '#2a2a33';
        mctx.beginPath(); mctx.ellipse(hcx, hty + 2, hw * 0.44, hw * 0.28, 0, Math.PI, 0, true); mctx.fill();
        mctx.fillStyle = '#c22727';
        mctx.beginPath(); mctx.arc(hcx, hty + 2 - hw * 0.26, 2.5, 0, Math.PI * 2); mctx.fill();
      } else if (cost === 'princess') {
        mctx.fillStyle = '#f5c542';
        mctx.beginPath();
        mctx.moveTo(hcx - hw * 0.26, hty + 3);
        mctx.lineTo(hcx - hw * 0.26, hty - 5);
        mctx.lineTo(hcx, hty - 8);
        mctx.lineTo(hcx + hw * 0.26, hty - 5);
        mctx.lineTo(hcx + hw * 0.26, hty + 3);
        mctx.closePath(); mctx.fill();
      } else if (cost === 'cowboy') {
        mctx.fillStyle = '#7a4a1e';
        mctx.beginPath(); mctx.ellipse(hcx, hty + 4, hw * 0.58, 2.8, 0, 0, Math.PI * 2); mctx.fill();
        mctx.fillStyle = '#8a5a2a';
        mctx.beginPath(); mctx.ellipse(hcx, hty + 2, hw * 0.32, hw * 0.24, 0, Math.PI, 0, true); mctx.fill();
      }
      mctx.restore();
    }
  }
  mctx.restore();
}

/* 🐺 選單大野狼：在後面賣力追小紅帽，永遠差一步追不到 */
function drawMiniWolf(x, yB, dw, dir, ph) {
  const meta = PARTS.wolf;
  const base = IMGS.wolf_pbase;
  if (!meta || !base) return;
  const dh = dw * (meta.h / meta.w);
  const sx = dw / meta.w, sy = dh / meta.h;
  mctx.save();
  mctx.translate(x, yB);
  mctx.fillStyle = 'rgba(60,40,10,0.20)';
  mctx.beginPath();
  mctx.ellipse(0, 2, dw * 0.34, dh * 0.06, 0, 0, Math.PI * 2);
  mctx.fill();
  mctx.scale(dir, 1);
  mctx.rotate(0.07 + Math.sin(ph) * 0.04);              // 前撲追逐姿勢
  mctx.translate(0, -Math.abs(Math.sin(ph)) * dh * 0.07); // 奮力奔跑彈跳

  const LX = px => px * sx - dw / 2, LY = py => py * sy - dh;
  const drawP = (p, ang) => {
    const im = IMGS['p_' + p.key];
    if (!im) return;
    const px = LX(p.px), py = LY(p.py);
    mctx.save();
    mctx.translate(px, py);
    mctx.rotate(ang);
    mctx.drawImage(im, LX(p.x) - px, LY(p.y) - py, p.w * sx, p.h * sy);
    mctx.restore();
  };
  const ang = p => {
    switch (p.swing) {
      case 'legA':  return Math.sin(ph) * 0.55;
      case 'legB':  return Math.sin(ph + Math.PI) * 0.55;
      case 'head':  return Math.sin(ph * 0.5) * 0.06 - 0.06;   // 伸頭向前嗅追
      case 'tail':  return Math.sin(ph * 0.9 + 1.2) * 0.22;    // 尾巴興奮搖擺
      default:      return 0;
    }
  };
  meta.parts.filter(p => p.layer === 'behind').forEach(p => drawP(p, ang(p)));
  mctx.drawImage(base, -dw / 2, -dh, dw, dh);
  meta.parts.filter(p => p.layer === 'front').forEach(p => drawP(p, ang(p)));

  // 💦 追不到的汗珠（萌萌挫折感）
  const sweatPh = (menuT * 1.4) % 1;
  if (sweatPh < 0.55) {
    mctx.fillStyle = 'rgba(140,200,255,' + (1 - sweatPh / 0.55) * 0.9 + ')';
    mctx.beginPath();
    mctx.ellipse(dw * 0.30, -dh * 0.86 + sweatPh * 26, 3.2, 4.6, 0, 0, Math.PI * 2);
    mctx.fill();
  }
  mctx.restore();
}

function menuLoop() {
  requestAnimationFrame(menuLoop);
  if (!document.getElementById('startOverlay').classList.contains('show')) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cw = menuCv.clientWidth, ch = menuCv.clientHeight;
  if (!cw || !ch) return;
  if (menuCv.width !== Math.round(cw * dpr) || menuCv.height !== Math.round(ch * dpr)) {
    menuCv.width = Math.round(cw * dpr);
    menuCv.height = Math.round(ch * dpr);
  }
  mctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  mctx.clearRect(0, 0, cw, ch);
  menuT += 0.016;
  // 小紅帽左右來回走，大野狼在後面賣力追（永遠差一步）
  const span = Math.max(cw - 210, 60);
  const k = (Math.sin(menuT * 0.42) + 1) / 2;
  const x = 110 + k * span;
  const dir = Math.cos(menuT * 0.42) >= 0 ? 1 : -1;
  const gap = 78 + Math.sin(menuT * 3.1) * 9;   // 距離忽近忽遠，就是追不到
  drawMiniWolf(x - dir * gap, ch - 8, 96, dir, menuT * 8.2 + 1.1);
  drawMiniPlayer(x, ch - 8, 78, dir, menuT * 7);
}
// 🎵 首頁音樂需用戶手勢解鎖：第一次點擊頁面即開始播放《每天的禱告》
document.addEventListener('pointerdown', () => {
  if (state === 'ready') BGM.play(5);
});

requestAnimationFrame(menuLoop);

requestAnimationFrame(loop);
</script>
